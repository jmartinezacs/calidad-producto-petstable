// Evaluación previa en pantalla (orientativa): la definitiva la hace la base de datos
function prever(m, valor) {
  if (valor === '' || valor === null || valor === undefined) return null;
  const p = m.parametro_referencia || 'ninguno';
  if (m.tipo_resultado !== 'numerico') {
    return p === 'exacto' ? String(valor).trim().toLowerCase() === String(m.valor_referencia_texto || '').trim().toLowerCase() : true;
  }
  const v = Number(valor), ref = m.valor_referencia === null ? null : Number(m.valor_referencia), max = m.valor_referencia_max === null ? null : Number(m.valor_referencia_max);
  if (!Number.isFinite(v)) return null;
  if (p === 'minimo') return ref !== null && v >= ref;
  if (p === 'maximo') return ref !== null && v <= ref;
  if (p === 'exacto') return ref !== null && v === ref;
  if (p === 'rango') return ref !== null && max !== null && v >= ref && v <= max;
  return true;
}

const DIAS = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];
function calendario(sel) {
  const hoy = todayISO();
  let cursor = (sel || hoy).slice(0, 7);
  const wrap = document.createElement('div');
  wrap.className = 'cal';
  const dibujar = (valor) => {
    const [y, mo] = cursor.split('-').map(Number);
    const ini = (new Date(Date.UTC(y, mo - 1, 1)).getUTCDay() + 6) % 7;
    const dias = new Date(Date.UTC(y, mo, 0)).getUTCDate();
    const celdas = Array.from({ length: ini }, () => '<span></span>').concat(Array.from({ length: dias }, (_, i) => {
      const iso = `${cursor}-${String(i + 1).padStart(2, '0')}`;
      return `<button type="button" class="cal-d ${iso === valor ? 'sel' : ''} ${iso === hoy ? 'hoy' : ''}" data-cal-d="${iso}" ${iso > hoy ? 'disabled title="Fecha futura"' : ''}>${i + 1}</button>`;
    }));
    wrap.innerHTML = `<div class="cal-head"><button type="button" class="icon-btn" data-cal="-1" aria-label="Mes anterior">${icon('chevron-left')}</button>
      <b>${esc(mesLargo(cursor))}</b><button type="button" class="icon-btn" data-cal="1" aria-label="Mes siguiente">${icon('chevron-right')}</button></div>
      <div class="cal-sem">${DIAS.map((d) => `<span>${d}</span>`).join('')}</div>
      <div class="cal-grid">${celdas.join('')}</div>
      <div class="cal-foot"><button type="button" class="link-btn" data-cal-d="${hoy}">Hoy</button></div>`;
    refreshIcons();
  };
  wrap.mover = (d, valor) => {
    const [y, mo] = cursor.split('-').map(Number);
    const f = new Date(Date.UTC(y, mo - 1 + d, 1));
    cursor = `${f.getUTCFullYear()}-${String(f.getUTCMonth() + 1).padStart(2, '0')}`;
    dibujar(valor);
  };
  wrap.dibujar = dibujar;
  dibujar(sel);
  return wrap;
}
const fmtDateLarga = (iso) => new Intl.DateTimeFormat('es-MX', { timeZone: 'UTC', weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }).format(new Date(`${iso}T12:00:00Z`));

function entrada(m, val, on) {
  const aria = `aria-label="Resultado de ${esc(m.metodo)}"`;
  if (m.tipo_resultado === 'numerico') return `<span class="mc-num"><input type="number" step="any" data-val value="${esc(val)}" placeholder="Resultado" ${aria} ${on ? '' : 'disabled'}>${m.unidades ? `<span class="mc-unit">${esc(m.unidades)}</span>` : ''}</span>`;
  if (m.tipo_resultado === 'verificacion') {
    return `<input type="hidden" data-val value="${esc(val)}"><div class="seg-check" role="group" ${aria}>
      <button type="button" class="${val === 'Cumple' ? 'on ok' : ''}" data-ver="Cumple">${icon('check')} Cumple</button>
      <button type="button" class="${val === 'No cumple' ? 'on bad' : ''}" data-ver="No cumple">${icon('x')} No cumple</button></div>`;
  }
  if (m.tipo_resultado === 'positivo_negativo') {
    return `<select data-val ${aria} ${on ? '' : 'disabled'}><option value="">Selecciona una opción</option>${['Positivo', 'Negativo'].map((o) => `<option ${val === o ? 'selected' : ''}>${o}</option>`).join('')}</select>`;
  }
  return `<input type="text" maxlength="120" data-val value="${esc(val)}" placeholder="Resultado" ${aria} ${on ? '' : 'disabled'}>`;
}

function criterioCampos(prefijo, tipo, param, m = {}) {

    <div class="field" data-num><label for="${prefijo}-val"><span data-lbl>Valor de referencia</span> <span class="req">*</span></label><input id="${prefijo}-val" name="valor" type="number" step="any" value="${esc(m.valor_referencia ?? '')}"></div>
    <div class="field" data-max><label for="${prefijo}-max">Valor máximo <span class="req">*</span></label><input id="${prefijo}-max" name="valor_max" type="number" step="any" value="${esc(m.valor_referencia_max ?? '')}"></div>
    <div class="field" data-txt><label for="${prefijo}-txt">Resultado esperado <span class="req">*</span></label>
      <select id="${prefijo}-txt" name="valor_texto"><option value="">Selecciona una opción</option>${['Positivo', 'Negativo'].map((o) => `<option ${m.valor_referencia_texto === o ? 'selected' : ''}>${o}</option>`).join('')}</select></div>`;
}
function criterioVisibilidad(form, tipo) {
  const p = form.param?.value || 'ninguno';
  const num = tipo === 'numerico';
  const show = (sel, v) => { const f = form.querySelector(sel); if (!f) return; f.classList.toggle('hidden', !v); f.querySelectorAll('input, select').forEach((i) => { i.disabled = !v; i.required = v; }); };
  show('[data-num]', num && p !== 'ninguno');
  show('[data-max]', num && p === 'rango');
  show('[data-txt]', tipo === 'positivo_negativo' && p === 'exacto');
  const lbl = form.querySelector('[data-lbl]');
  if (lbl) lbl.textContent = p === 'rango' ? 'Valor mínimo' : p === 'minimo' ? 'Límite mínimo' : p === 'maximo' ? 'Límite máximo' : 'Valor de referencia';
}
function criterioValores(form, tipo) {
  if (tipo === 'verificacion') return { p: 'exacto', v: null, mx: null, txt: 'Cumple' };
  const p = form.param.value;
  const num = tipo === 'numerico';
  const v = num && p !== 'ninguno' ? Number(form.valor.value) : null;
  const mx = num && p === 'rango' ? Number(form.valor_max.value) : null;
  if (p === 'rango' && v > mx) throw new Error('El valor mínimo debe ser menor o igual al máximo.');
  return { p, v, mx, txt: !num && p === 'exacto' ? form.valor_texto.value : null };
}

let root;
const norm = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const plano = (s) => s.replace(/\*\*/g, '');
function htmlRespuesta(txt) {
  const fmt = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  let html = '', lista = [];
  const cerrar = () => { if (lista.length) { html += `<ul>${lista.map((l) => `<li>${fmt(l)}</li>`).join('')}</ul>`; lista = []; } };
  txt.split('\n').forEach((l) => { if (l.startsWith('- ')) lista.push(l.slice(2)); else { cerrar(); html += `<p>${fmt(l)}</p>`; } });
  cerrar();
  return html;
}

function filtrar(texto) {
  const t = norm(texto.trim());
  let visibles = 0;
  root.querySelectorAll('.faq-sec').forEach((sec) => {
    if (sec.classList.contains('faq-instalar')) { const ok = !t || sec.dataset.texto.includes(t); sec.classList.toggle('hidden', !ok); visibles += ok; return; }
    let n = 0;
    sec.querySelectorAll('.faq-item').forEach((it) => {
      const ok = !t || it.dataset.texto.includes(t);
      it.classList.toggle('hidden', !ok);
      it.open = !!t && ok;
      n += ok;
    });
    sec.classList.toggle('hidden', !n);
    visibles += n;
  });
  root.querySelector('#faq-vacio').classList.toggle('hidden', visibles > 0);
}

async function svgAPng(svgTxt, escala = 3) {
  const img = new Image();
  img.src = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svgTxt)}`;
  await img.decode();
  const c = document.createElement('canvas');
  c.width = 240 * escala; c.height = 300 * escala;
  const g = c.getContext('2d');
  g.drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/png');
}
async function imagenAPng(src) {
  if (!src) return null;
  const img = new Image(); img.src = src; await img.decode();
  const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight;
  c.getContext('2d').drawImage(img, 0, 0);
  return c.toDataURL('image/png');
}

      a.classList.toggle('active', on);
      if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    // El título de la pestaña permanece fijo al navegar
    document.title = 'Liberación de producto';
    closeMenu();
    // Contenedor nuevo en cada vista: los eventos de la vista anterior no se acumulan
    // (antes se abrían dos ventanas iguales y al guardar quedaba una abierta)
    const viejo = $('#view');
    const view = viejo.cloneNode(false);
    viejo.replaceWith(view);
    window.scrollTo(0, 0);
    await r.mod.render(view, params);
    refreshIcons();
  } catch (err) {
    console.error(err);
    $('#view').innerHTML = `<div class="card">${esc(errMsg(err))}</div>`;
  } finally {
    routing = false;
    if (pendingRoute) { pendingRoute = false; route(); }
  }
}

// ---------------- Avisos (campana) ----------------
let avisos = [];
let avisosVistos = null; // ids conocidos: los nuevos se anuncian con un mensaje
async function cargarAvisos() {
  if (!state.profile || document.hidden && avisosVistos) return;
  const { data, error } = await sb.from('brom_notificaciones')
    .select('id, tipo, titulo, mensaje, leida, created_at, muestra_id, actor_nombre, brom_muestras(lote)')
    .eq('usuario_id', state.profile.id).order('created_at', { ascending: false }).limit(40);
  if (error) { if (!/brom_notificaciones/.test(error.message || '')) console.warn(error); return; }
  const nuevos = avisosVistos ? data.filter((x) => !x.leida && !avisosVistos.has(x.id)) : [];
  avisosVistos = new Set(data.map((x) => x.id));
  avisos = data;
  pintarAvisos();
  if (nuevos.length === 1) toast(`${nuevos[0].titulo}. ${nuevos[0].mensaje}`, 'info', 7000);
  else if (nuevos.length > 1) toast(`Tienes ${nuevos.length} avisos nuevos.`, 'info', 6000);
}
function pintarAvisos() {
  const n = avisos.filter((x) => !x.leida).length;
  const c = $('#notif-count');
  c.textContent = n > 99 ? '99+' : String(n);
  c.classList.toggle('hidden', !n);
  $('.notif-btn').setAttribute('aria-label', n ? `Notificaciones: ${n} sin leer` : 'Notificaciones');
  $('.notif-btn').classList.toggle('has', !!n);
  const panel = $('#notif-panel');
  if (panel.classList.contains('hidden')) return;
  const hace = (iso) => {
    const min = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
    if (min < 1) return 'Ahora';
    if (min < 60) return `Hace ${min} min`;
    if (min < 24 * 60) return `Hace ${Math.round(min / 60)} h`;
    return new Intl.DateTimeFormat('es-MX', { timeZone: TZ, day: 'numeric', month: 'long' }).format(new Date(iso));
  };
  panel.innerHTML = `<div class="np-head"><b>${icon('bell')} Notificaciones</b>${n ? `<button class="link-btn" data-action="aviso-todas">Marcar todas como leídas</button>` : ''}</div>
    ${avisos.length ? `<div class="np-list">${avisos.map((x) => {
      const t = TIPOS_AVISO[x.tipo] || TIPOS_AVISO.prueba;
      return `<button class="np-item ${x.leida ? '' : 'nueva'}" data-action="aviso-abrir" data-id="${esc(x.id)}" style="--tc:${t.color}">
        <span class="np-ico">${icon(t.ico)}</span>
        <span class="np-txt"><b>${esc(x.titulo)}</b><span>${esc(x.mensaje)}</span><small>${esc(t.label)} · ${esc(hace(x.created_at))}</small></span>
        ${x.leida ? '' : '<span class="np-dot" aria-label="Sin leer"></span>'}</button>`;
    }).join('')}</div>` : `<div class="np-vacio">${icon('bell-off')}<b>Sin notificaciones</b><span>Aquí aparecerán los lotes por capturar, las áreas capturadas y los lotes listos para liberar.</span></div>`}
    <button class="np-pie" data-action="aviso-config">${icon('settings')} Configurar notificaciones y correos</button>`;
  refreshIcons();
}
function alternarAvisos() {
  const panel = $('#notif-panel');
  const abrir = panel.classList.contains('hidden');
  panel.classList.toggle('hidden', !abrir);
  $('.notif-btn').setAttribute('aria-expanded', String(abrir));
  if (abrir) { pintarAvisos(); cargarAvisos(); }
}
function cerrarAvisos() {
  const panel = $('#notif-panel');
  if (!panel || panel.classList.contains('hidden')) return;
  panel.classList.add('hidden');
  $('.notif-btn').setAttribute('aria-expanded', 'false');
}
async function marcarAvisos(ids = avisos.filter((x) => !x.leida).map((x) => x.id)) {
  if (!ids.length) return;
  const { error } = await sb.from('brom_notificaciones').update({ leida: true }).in('id', ids);
  if (error) { toast(errMsg(error), 'error'); return; }
  avisos.forEach((x) => { if (ids.includes(x.id)) x.leida = true; });
  pintarAvisos();
}
async function abrirAviso(id) {
  const x = avisos.find((a) => a.id === id);
  if (!x) return;
  if (!x.leida) await marcarAvisos([id]);
  cerrarAvisos();
  const lote = x.brom_muestras?.lote;
  navigate(x.tipo === 'prueba' ? '#/perfil' : lote ? `#/lotes?q=${encodeURIComponent(lote)}` : '#/lotes');
}

// ---------------- Eventos globales ----------------
function bindGlobalEvents() {
  document.addEventListener('click', async (e) => {
    // Al elegir una vista del menú (aunque sea la actual) el menú se oculta
    if (e.target.closest('#nav a, #mobile-nav a')) closeMenu();
    const a = e.target.closest('[data-action]');
    if (!a) return;
    switch (a.dataset.action) {
      case 'toggle-menu': toggleMenu(); break;
      case 'close-menu': closeMenu(); break;
      case 'toggle-theme': cycleTheme(); break;
      case 'go-profile': navigate('#/perfil'); break;
      case 'go-home': navigate('#/panel'); break;
      case 'fab-lote': {
        // Tras registrar un lote, refrescar la vista si muestra lotes o resultados
        if (await ganchos.openLoteForm?.() && ['panel', 'lotes', 'resultados'].includes(parseHash().name)) route();
        break;
      }
      case 'toggle-fs': alternarPantallaCompleta(); break;
      case 'logout': await logout(); break;
      case 'reload-app': location.reload(); break;
      case 'update-later': $('#update-bar').classList.add('hidden'); break;
      case 'toggle-pw': togglePw(a); break;
      case 'forgot': await forgotPassword(); break;
      case 'toggle-notif': alternarAvisos(); break;
      case 'aviso-todas': await marcarAvisos(); break;
      case 'aviso-abrir': await abrirAviso(a.dataset.id); break;
      case 'aviso-config': cerrarAvisos(); navigate('#/perfil'); break;
      default: break;
    }
  });
  // La campana se cierra al hacer clic fuera o con Esc
  document.addEventListener('click', (e) => { if (!e.composedPath().some((n) => n.classList?.contains('notif-wrap'))) cerrarAvisos(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') cerrarAvisos(); });
  $('#login-form').addEventListener('submit', login);
  window.addEventListener('online', updateNet);
  window.addEventListener('offline', updateNet);
  updateNet();
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && document.body.classList.contains('menu-open') && !document.querySelector('.modal')) closeMenu();
  });
}

// Menú lateral: siempre oculto; se despliega con el botón y se cierra al elegir una vista
function setMenu(open) {
  document.body.classList.toggle('menu-open', open);
  document.querySelector('.top .menu-btn')?.setAttribute('aria-expanded', String(open));
}
function toggleMenu() { setMenu(!document.body.classList.contains('menu-open')); }
function closeMenu() { setMenu(false); }

function togglePw(btn) {
  const inp = btn.parentElement.querySelector('input');
  const show = inp.type === 'password';
  inp.type = show ? 'text' : 'password';
  btn.setAttribute('aria-label', show ? 'Ocultar contraseña' : 'Mostrar contraseña');
  btn.innerHTML = icon(show ? 'eye-off' : 'eye');
  refreshIcons();
}

function updateNet() {
  const el = $('#net-status');
  if (!el) return;
  const on = navigator.onLine;
  el.textContent = on ? 'En vivo' : 'Sin conexión';
  el.classList.toggle('off', !on);
  if (booted && !on) toast('Sin conexión. Los cambios no se guardarán hasta recuperar la red.', 'warning');
}

// Fecha completa (lunes 12 de octubre de 2026) y hora con segundos, hora de Ciudad de México
function startClock() {
  const dEl = $('#clock-date'), tEl = $('#clock-time');
  const parts = new Intl.DateTimeFormat('es-MX', { timeZone: TZ, weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  const time = new Intl.DateTimeFormat('es-MX', { timeZone: TZ, hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' });
  const tick = () => {
    const now = new Date();
    const p = Object.fromEntries(parts.formatToParts(now).map((x) => [x.type, x.value]));
    const wd = p.weekday.charAt(0).toUpperCase() + p.weekday.slice(1);
    dEl.textContent = `${wd} ${p.day} de ${p.month} del ${p.year}`;
    tEl.textContent = time.format(now);
  };
  tick(); setInterval(tick, 1000);
}

// ---------------- Tema ----------------
function currentTheme() { return prefs.get('brom.theme') || 'system'; }
function setTheme(t) {
  if (t === 'light' || t === 'dark') { document.documentElement.setAttribute('data-theme', t); prefs.set('brom.theme', t); }
  else { document.documentElement.removeAttribute('data-theme'); prefs.del('brom.theme'); }
  updateThemeButton();
  // Solo re-colorea las gráficas (sin volver a cargar la vista): cambio inmediato
  requestAnimationFrame(restyleCharts);
}
window.__bromSetTheme = setTheme;
// Si el tema sigue al sistema y éste cambia, actualizar selector y gráficas
window.matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => {
  if (currentTheme() !== 'system') return;
  updateThemeButton();
  requestAnimationFrame(restyleCharts);
});
function effectiveDark() {
  const t = currentTheme();
  return t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
}
function cycleTheme() { setTheme(effectiveDark() ? 'light' : 'dark'); }
// El selector muestra sol y luna; se resalta el modo activo
function updateThemeButton() {
  const dark = effectiveDark();
  const btn = document.querySelector('.theme-toggle');
  btn.classList.toggle('is-dark', dark);
  btn.setAttribute('aria-label', dark ? 'Modo oscuro activo. Cambiar a modo claro' : 'Modo claro activo. Cambiar a modo oscuro');
}

// ---------------- Autenticación ----------------
async function login(e) {
  e.preventDefault();
  const form = e.currentTarget;
  const msg = $('#login-msg');
  msg.className = 'login-msg hidden';
  if (!checkForm(form, {
    email: (v) => (/@petstable\.mx$/i.test(v) ? '' : 'Usa tu correo corporativo @petstable.mx.'),
  })) return;
  const btn = $('#login-submit');
  if (btn.disabled) return;
  btn.disabled = true; btn.innerHTML = '<span class="spinner sm"></span> Verificando…';
  prefs.set('brom.remember', $('#login-remember').checked ? '1' : '0');
  const { error } = await sb.auth.signInWithPassword({
    email: form.email.value.trim().toLowerCase(),
    password: form.password.value,
  });
  if (error) {
    btn.disabled = false; btn.innerHTML = `${icon('log-in')} Entrar`; refreshIcons();
    msg.className = 'login-msg error';
    msg.textContent = /invalid login credentials/i.test(error.message)
      ? 'Correo o contraseña incorrectos.'
      : /email not confirmed/i.test(error.message) ? 'Tu correo aún no está confirmado. Revisa tu bandeja de entrada.'
      : /rate limit|too many/i.test(error.message) ? 'Demasiados intentos. Espera unos minutos e inténtalo de nuevo.'
      : errMsg(error);
    return;
  }
  form.password.value = '';
}

async function logout() {
  // scope "local": cierra solo esta sesión (otras apps de Pet's Table comparten la cuenta)
  await sb.auth.signOut({ scope: 'local' });
  state.profile = null; state.session = null;
  avisos = []; avisosVistos = null; cerrarAvisos(); pintarAvisos();
  history.replaceState(null, '', location.pathname);
  showLogin();
  toast('Sesión cerrada.', 'success');
}

async function forgotPassword() {
  const email = $('#login-email').value.trim();
  await openModal({
    title: 'Restablecer contraseña',
    subtitle: 'Te enviaremos un enlace a tu correo corporativo.',
    size: 'sm', submitText: 'Enviar enlace', confirmDiscard: false,
    body: `<div class="field"><label for="fp-email">Correo corporativo <span class="req">*</span></label>
      <input id="fp-email" name="email" type="email" required maxlength="120" value="${esc(email)}" placeholder="nombre@petstable.mx"></div>
      <p class="hint">Esta contraseña es la misma de tu cuenta Pet's Table en las demás aplicaciones.</p>`,
    onSubmit: async ({ form }) => {
      if (!checkForm(form, { email: (v) => (/@petstable\.mx$/i.test(v) ? '' : 'Usa tu correo @petstable.mx.') })) return false;
      const { error } = await sb.auth.resetPasswordForEmail(form.email.value.trim().toLowerCase(), { redirectTo: `${location.origin}/` });
      if (error) throw error;
      toast('Si el correo está registrado, recibirás un enlace para restablecer tu contraseña.', 'success', 7000);
    },
  });
}

async function recoveryFlow() {
  hideSplash();
  $('#login').classList.remove('hidden');
  await openModal({
    title: 'Define tu nueva contraseña', size: 'sm', submitText: 'Guardar contraseña', confirmDiscard: false,
    body: `<div class="field"><label for="np1">Nueva contraseña <span class="req">*</span></label>
        <input id="np1" name="p1" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></div>
      <div class="field"><label for="np2">Confirmar contraseña <span class="req">*</span></label>
        <input id="np2" name="p2" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></div>
      <p class="hint">Mínimo 8 caracteres. Combina letras, números y símbolos.</p>`,
    onSubmit: async ({ form }) => {
      if (!checkForm(form, { p2: (v, f) => (v !== f.p1.value ? 'Las contraseñas no coinciden.' : '') })) return false;
      const { error } = await sb.auth.updateUser({ password: form.p1.value });
      if (error) throw error;
      toast('Contraseña actualizada.', 'success');
    },
  });
  history.replaceState(null, '', location.pathname);
  const { data } = await sb.auth.getSession();
  if (data.session) { state.session = data.session; await loadProfileAndStart(); } else showLogin();
}

// Si la sesión inicial no dispara eventos (p. ej. sin sesión guardada), mostrar login
setTimeout(async () => {
  if (!$('#splash').classList.contains('hidden')) {
    const { data } = await sb.auth.getSession();
    if (!data.session) showLogin();
  }
}, 2500);

Object.assign(__exp, { setTheme });
return __exp;
})();
})();</script>
