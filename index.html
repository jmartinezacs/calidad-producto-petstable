/* Barras de desplazamiento acordes al sitio */
html { scrollbar-color: #F58020 var(--soft); scrollbar-width: thin; }
.sidebar, .modal-body, .table-wrap, .combo-list, .tabs { scrollbar-width: thin; scrollbar-color: rgba(245, 128, 32, .8) transparent; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: var(--soft); }
::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #F58020, #FF9A2F); border-radius: 999px; border: 2px solid var(--soft); }
::-webkit-scrollbar-thumb:hover { background: linear-gradient(180deg, #E06A0C, #F58020); }
::-webkit-scrollbar-corner { background: transparent; }
.sidebar { scrollbar-color: rgba(245, 128, 32, .8) #090D12; }
.sidebar::-webkit-scrollbar-track { background: #090D12; }
.sidebar::-webkit-scrollbar-thumb { border-color: #090D12; }
.modal-body::-webkit-scrollbar-track, .table-wrap::-webkit-scrollbar-track, .combo-list::-webkit-scrollbar-track { background: transparent; }
.modal-body::-webkit-scrollbar-thumb, .table-wrap::-webkit-scrollbar-thumb, .combo-list::-webkit-scrollbar-thumb { border-color: var(--card); }

/* Botones flotantes */
.fabs { position: fixed; right: 24px; bottom: 24px; z-index: 450; display: flex; flex-direction: column; gap: 16px; }
.fab { position: relative; width: 58px; height: 58px; border-radius: 50%; border: 0; color: #fff; display: grid; place-items: center; cursor: pointer;
  box-shadow: 0 10px 26px rgba(9, 13, 18, .28); transition: transform .15s, box-shadow .15s; }
.fab svg { width: 26px; height: 26px; }
.fab-cita { background: linear-gradient(135deg, #F58020, #FF9A2F); }
.fab-home { background: linear-gradient(135deg, #0B2235, #1B3A55); border: 2px solid rgba(27, 199, 199, .6); }
.fab:hover { transform: translateY(-3px) scale(1.04); box-shadow: 0 0 0 4px rgba(245, 128, 32, .25), 0 12px 30px rgba(245, 128, 32, .45); }
.fab-tip { position: absolute; right: calc(100% + 12px); top: 50%; transform: translateY(-50%); white-space: nowrap; background: #102536; color: #fff; font-size: 12px; font-weight: 800;
  padding: 7px 11px; border-radius: 9px; opacity: 0; pointer-events: none; transition: opacity .15s; box-shadow: 0 8px 20px rgba(0, 0, 0, .2); }
.fab:hover .fab-tip, .fab:focus-visible .fab-tip { opacity: 1; }
.content { padding-bottom: 120px; }
.toasts { right: 100px; }
body.menu-open .fabs { display: none; }
@media (max-width: 720px) {
  .fabs { right: 14px; bottom: calc(78px + env(safe-area-inset-bottom)); gap: 12px; }
  .fab { width: 52px; height: 52px; }
  .fab svg { width: 23px; height: 23px; }
  .fab-tip { display: none; }
  .content { padding-bottom: calc(210px + env(safe-area-inset-bottom)); }
  .toasts { top: calc(var(--header-h) + 10px); bottom: auto; left: 12px; right: 12px; }
}
@media print { .fabs { display: none !important; } }

/* =====================================================================
   v1.3 · Login de una sola pantalla, logo mayor, barras de desplazamiento
   en el color del encabezado, disponibilidad, padecimientos y avisos
   ===================================================================== */
/* ---------- Login: todo visible sin desplazarse ---------- */
.login { position: relative; display: flex; align-items: center; justify-content: center; height: 100vh; height: 100dvh; min-height: 0; overflow: hidden;
  background: linear-gradient(160deg, #0B2235 0%, #07131E 60%, #090D12 100%); padding: 12px 16px; }
.login-glow { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .55; pointer-events: none; }
.login-glow.g1 { width: 46vmax; height: 46vmax; left: -14vmax; bottom: -18vmax; background: rgba(27, 199, 199, .45); }
.login-glow.g2 { width: 40vmax; height: 40vmax; right: -12vmax; top: -16vmax; background: rgba(245, 128, 32, .5); }
.login-wrap { position: relative; z-index: 1; width: min(420px, 100%); max-height: 100%; display: flex; flex-direction: column; align-items: center; gap: clamp(8px, 2vh, 16px); }
.login-logo { width: clamp(96px, 16vh, 140px); height: clamp(76px, 12.7vh, 111px); }
.login-card { width: 100%; text-align: center; padding: clamp(16px, 3vh, 28px) clamp(18px, 4vw, 30px); border-radius: 22px;
  background: var(--card); border: 1px solid var(--line); box-shadow: 0 24px 60px rgba(0, 0, 0, .35); }
.login-card .app-icon { width: clamp(44px, 7vh, 60px); height: clamp(44px, 7vh, 60px); border-radius: 15px; display: block; margin: 0 auto; box-shadow: 0 8px 20px rgba(245, 128, 32, .3); }
.login-card h1 { margin: clamp(6px, 1.4vh, 12px) 0 2px; font-size: clamp(20px, 3.2vh, 26px); letter-spacing: -.02em; color: var(--text); }
.login-sub { margin: 0 0 clamp(8px, 2vh, 16px); color: var(--muted); font-size: 12.5px; }
.login-card .field { margin: clamp(5px, 1.2vh, 10px) 0; text-align: center; }
.login-card .field label { text-align: center; }
.login-card .field input { text-align: center; min-height: clamp(40px, 5.6vh, 46px); }
.login-card .pw-wrap input { padding-left: 46px !important; }
.login-card .login-options { flex-direction: column; justify-content: center; gap: 4px; margin: clamp(4px, 1vh, 8px) 0 clamp(8px, 1.6vh, 14px); }
.login-card .btn.lg { min-height: clamp(42px, 6vh, 48px); }
.login-chips { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px; margin-top: clamp(8px, 1.8vh, 14px); }
.login-chips span { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; color: var(--muted); background: var(--soft); border: 1px solid var(--line); border-radius: 999px; padding: 4px 9px; }
.login-chips svg { width: 13px; height: 13px; color: var(--orange); }
.login-foot { color: #7E93A3; font-size: 11px; }
.login .login-msg { text-align: center; }
@media (max-height: 640px) { .login-chips, .login-foot { display: none; } .login-card .login-options { flex-direction: row; justify-content: space-between; } }
@media (max-height: 540px) { .login-logo, .login-card .app-icon { display: none; } }

/* ---------- Logo del encabezado más grande ---------- */
.top-logo { height: 52px; width: 66px; }
@media (max-width: 720px) { .top-logo { height: 40px; width: 50px; } }

/* ---------- Barras de desplazamiento en el color del encabezado ---------- */
html { scrollbar-color: #1B2A36 var(--soft); }
.sidebar, .modal-body, .table-wrap, .combo-list, .tabs { scrollbar-color: #2A3B49 transparent; }
::-webkit-scrollbar-thumb { background: #1B2A36; border: 2px solid var(--soft); }
::-webkit-scrollbar-thumb:hover { background: #090D12; }
.sidebar { scrollbar-color: #2D3D4B #090D12; }
.sidebar::-webkit-scrollbar-thumb { background: #2D3D4B; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) ::-webkit-scrollbar-thumb { background: #2D4253; } :root:not([data-theme="light"]) { scrollbar-color: #2D4253 var(--soft); } }
:root[data-theme="dark"] ::-webkit-scrollbar-thumb { background: #2D4253; }
:root[data-theme="dark"] { scrollbar-color: #2D4253 var(--soft); }

/* ---------- Cambio de tema inmediato ---------- */
body { transition: none; }

/* ---------- Disponibilidad de citas en el panel ---------- */
.avail { position: relative; overflow: hidden; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 22px; align-items: center; padding: 20px 24px; border-radius: 20px; margin-bottom: 16px;
  border: 1px solid var(--line); box-shadow: var(--shadow); background: var(--card); }
.avail::before { content: ""; position: absolute; inset: 0; background: radial-gradient(500px 200px at 0% 50%, rgba(22, 163, 74, .14), transparent 70%); pointer-events: none; }
.avail.lleno::before { background: radial-gradient(500px 200px at 0% 50%, rgba(220, 38, 38, .12), transparent 70%); }
.avail.cerrado::before { background: radial-gradient(500px 200px at 0% 50%, rgba(27, 199, 199, .14), transparent 70%); }
.avail-ring { position: relative; width: 92px; height: 92px; border-radius: 50%; display: grid; place-items: center;
  background: conic-gradient(#16A34A calc(var(--p) * 1%), var(--soft) 0); }
.avail.lleno .avail-ring { background: conic-gradient(#DC2626 calc(var(--p) * 1%), var(--soft) 0); }
.avail.cerrado .avail-ring { background: conic-gradient(#1BC7C7 calc(var(--p) * 1%), var(--soft) 0); }
.avail-ring::after { content: ""; position: absolute; inset: 9px; border-radius: 50%; background: var(--card); }
.avail-ring b { position: relative; z-index: 1; font-size: 26px; line-height: 1; text-align: center; }
.avail-ring small { display: block; font-size: 9.5px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.avail-txt { position: relative; min-width: 0; }
.avail-tag { display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px; border-radius: 999px; color: #fff; font-weight: 900; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; background: #16A34A; }
.avail-tag::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #fff; animation: blink 1.2s ease-in-out infinite; }
.avail.lleno .avail-tag { background: #DC2626; }
.avail.cerrado .avail-tag { background: #0891B2; }
.avail-txt h3 { margin: 8px 0 4px; font-size: 19px; letter-spacing: -.01em; }
.avail-txt p { margin: 0; color: var(--muted); font-size: 12px; }
.avail-slots { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.avail-slots button { border: 1px solid rgba(22, 163, 74, .4); background: rgba(22, 163, 74, .1); color: #15803D; font-weight: 800; font-size: 12px; padding: 5px 10px; border-radius: 9px; font-variant-numeric: tabular-nums; }
:root[data-theme="dark"] .avail-slots button { color: #4ADE80; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .avail-slots button { color: #4ADE80; } }
.avail-slots .more { color: var(--muted); font-size: 12px; align-self: center; }
.avail-cta { position: relative; }
@media (max-width: 760px) {
  .avail { grid-template-columns: minmax(0, 1fr); justify-items: center; text-align: center; gap: 12px; }
  .avail-slots { justify-content: center; }
}

/* ---------- Estadísticas por padecimiento ---------- */
.dept-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.total-badge { display: inline-flex; align-items: center; gap: 6px; margin-top: 6px; padding: 4px 11px; border-radius: 999px; background: #0B2235; color: #fff; font-weight: 900; font-size: 11.5px; }
.total-badge b { color: #FFB36B; font-size: 13px; }
.section-label { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 24px 0 12px; font-size: 13px; font-weight: 900; text-transform: uppercase; letter-spacing: .12em; color: var(--text); }
.section-label::before, .section-label::after { content: ""; flex: 1; height: 1px; background: var(--line); }

/* ---------- Avisos / notificaciones ---------- */
.notif-banner { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 16px; margin-bottom: 16px; background: linear-gradient(135deg, rgba(245, 128, 32, .12), rgba(27, 199, 199, .1)); border: 1px solid rgba(245, 128, 32, .35); }
.notif-banner .nb-ico { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; background: #F58020; color: #fff; flex: 0 0 auto; }
.notif-banner .nb-txt { flex: 1; min-width: 0; }
.notif-banner b { display: block; font-size: 13.5px; }
.notif-banner span { color: var(--muted); font-size: 12px; }
@media (max-width: 600px) { .notif-banner { flex-wrap: wrap; justify-content: center; text-align: center; } }

/* Galería de fotos existentes */
.photo-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 10px; max-height: 50vh; overflow-y: auto; padding: 4px; }
.photo-gallery button { border: 2px solid transparent; background: var(--soft); border-radius: 14px; padding: 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.photo-gallery button:hover, .photo-gallery button.sel { border-color: var(--orange); }
.photo-gallery img { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; }
.photo-gallery span { font-size: 10.5px; color: var(--text); text-align: center; overflow-wrap: anywhere; }
.acc-results { display: grid; gap: 6px; margin-top: 8px; max-height: 260px; overflow-y: auto; }
.acc-results button { display: flex; align-items: center; gap: 10px; text-align: left; border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 8px 10px; color: var(--text); }
.acc-results button:disabled { opacity: .55; cursor: not-allowed; }
.acc-results .acc-main { flex: 1; min-width: 0; }
.acc-results b { display: block; font-size: 12.5px; }
.acc-results small { color: var(--muted); font-size: 11px; }
.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--soft); }
.switch-row input { width: 20px; height: 20px; accent-color: var(--orange); }
.acc-results button.sel { border-color: var(--orange); box-shadow: 0 0 0 3px rgba(245, 128, 32, .18); }

/* =====================================================================
   v1.4 · Menús desplegables propios, tabla de usuarios, urgencias
   ===================================================================== */
/* ---------- Menús desplegables (select / sugerencias) ---------- */
.cs { position: relative; display: block; width: 100%; min-width: 0; }
.toolbar .cs { display: inline-block; width: auto; min-width: 150px; flex: 0 1 auto; }
.pager .cs { width: auto; min-width: 130px; }
.cs-native { position: absolute !important; inset: 0; width: 100% !important; height: 100% !important; opacity: 0 !important; pointer-events: none !important; }
.cs-btn { width: 100%; min-height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 12px 0 14px;
  border: 1px solid var(--input-line); border-radius: 11px; background: var(--input); color: var(--text); font-size: 13.5px; font-weight: 600; text-align: left;
  transition: border-color .12s, box-shadow .12s; cursor: pointer; }
.toolbar .cs-btn { min-height: 40px; font-size: 12.5px; border-radius: 10px; }
.pager .cs-btn { min-height: 34px; font-size: 12px; border-radius: 9px; }
.cs-btn:hover:not(:disabled) { border-color: var(--orange) !important; box-shadow: 0 0 0 3px rgba(245, 128, 32, .14) !important; }
.cs-btn:focus-visible, .cs-btn[aria-expanded="true"] { outline: none; border-color: var(--turq); box-shadow: 0 0 0 3px rgba(27, 199, 199, .18); }
.cs-btn:disabled { opacity: .6; cursor: not-allowed; }
.cs-val { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cs-val.ph { color: var(--muted); font-weight: 500; }
.cs-chev { flex: 0 0 auto; color: var(--orange); transition: transform .15s; }
.cs-btn[aria-expanded="true"] .cs-chev { transform: rotate(180deg); }
.field.invalid .cs-btn { border-color: var(--bad); box-shadow: 0 0 0 3px rgba(224, 70, 78, .1); }
.cs-panel { position: fixed; z-index: 3000; max-height: 300px; overflow-y: auto; padding: 6px; border-radius: 14px; background: var(--card);
  border: 1px solid var(--line); box-shadow: 0 18px 44px rgba(9, 13, 18, .25); animation: pop .12s ease; scrollbar-width: thin; }
.cs-opt { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 11px; border-radius: 9px; font-size: 13px; color: var(--text); cursor: pointer; }
.cs-opt.ph { color: var(--muted); }
.cs-opt.hl { background: var(--soft); }
.cs-opt.sel { background: rgba(245, 128, 32, .12); color: #C2560A; font-weight: 800; }
:root[data-theme="dark"] .cs-opt.sel { color: #FFB36B; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .cs-opt.sel { color: #FFB36B; } }
.cs-opt.sel svg { color: var(--orange); flex: 0 0 auto; }
.cs-opt.dis { opacity: .45; cursor: not-allowed; }
.cs-dl { position: relative; }

/* ---------- Tabla de usuarios: fotos alineadas, campana y puesto ---------- */
.table th.col-user, .table td.col-user { text-align: left; padding-left: 22px; }
.table td.col-user .user-cell { justify-content: flex-start; }
.user-photo { position: relative; flex: 0 0 auto; display: inline-flex; }
.user-txt { min-width: 0; }
.bell-badge { position: absolute; right: -7px; bottom: -5px; width: 21px; height: 21px; border-radius: 50%; display: grid; place-items: center;
  background: var(--card); box-shadow: 0 2px 7px rgba(9, 13, 18, .25); animation: bellSwing 2.4s ease-in-out infinite; transform-origin: 50% 20%; }
@keyframes bellSwing { 0%, 70%, 100% { transform: rotate(0); } 75% { transform: rotate(14deg); } 82% { transform: rotate(-12deg); } 89% { transform: rotate(6deg); } }
.puesto-txt { font-size: 11.5px; font-weight: 800; color: var(--text); }
@media (max-width: 720px) { .table-wrap.responsive td.col-user { padding-left: 10px; text-align: right; } .table-wrap.responsive td.col-user .user-cell { justify-content: flex-end; } }

/* ---------- Citas de urgencia ---------- */
.urg-switch { margin-bottom: 10px; border-color: rgba(220, 38, 38, .35); background: rgba(220, 38, 38, .06); cursor: pointer; }
.urg-switch b { display: inline-flex; align-items: center; gap: 6px; color: #B91C1C; }
:root[data-theme="dark"] .urg-switch b { color: #FCA5A5; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .urg-switch b { color: #FCA5A5; } }
.urg-switch input { accent-color: #DC2626; }
.urg-btn { background: linear-gradient(135deg, #DC2626, #F87171); color: #fff; box-shadow: 0 7px 16px rgba(220, 38, 38, .22); margin-top: 8px; }
.avail-cta { display: flex; flex-direction: column; align-items: stretch; }
.agenda-slot.urg { border-color: rgba(220, 38, 38, .4); background: rgba(220, 38, 38, .05); }

/* =====================================================================
   v1.5 · Pantalla de acceso siempre en modo oscuro
   (independiente del tema elegido dentro del sitio)
   ===================================================================== */
.login {
  --card: #0D1B26; --soft: #122431; --text: #EEF3F7; --muted: #93A5B3; --line: #213443;
  --input: #0F202C; --input-line: #2A4152; --bad: #FF8A90; --bad-bg: rgba(255, 138, 144, .12); --bad-line: rgba(255, 138, 144, .32);
  --info: #5FE0E0; --info-bg: rgba(95, 224, 224, .12); --info-line: rgba(95, 224, 224, .3);
  color-scheme: dark; color: var(--text);
}
.login .login-card { background: rgba(13, 27, 38, .92); border-color: rgba(255, 255, 255, .08); backdrop-filter: blur(6px); box-shadow: 0 24px 60px rgba(0, 0, 0, .5); }
.login .field label { color: #B9C8D3; }
.login .field input { color: var(--text); }
.login .field input::placeholder { color: #6F8697; }
.login .check { color: #B9C8D3; }
.login .link-btn { color: #5FE0E0; }
.login .pw-toggle { color: #93A5B3; }
.login-chips span { background: rgba(255, 255, 255, .05); border-color: rgba(255, 255, 255, .1); color: #B9C8D3; }
/* Autocompletado del navegador sin fondo claro */
.login input:-webkit-autofill, .login input:-webkit-autofill:hover, .login input:-webkit-autofill:focus {
  -webkit-text-fill-color: #EEF3F7; caret-color: #EEF3F7;
  -webkit-box-shadow: 0 0 0 1000px #0F202C inset; box-shadow: 0 0 0 1000px #0F202C inset; transition: background-color 9999s;
}

/* ===================== v1.6 ===================== */
[hidden] { display: none !important; }
.login-foot a { color: inherit; text-decoration: underline; text-underline-offset: 2px; }
.login-foot a:hover { color: var(--orange); }
.login-foot a::before { content: '·'; display: inline-block; margin: 0 6px; text-decoration: none; }

/* Agenda: horarios sin servicio */
.agenda-slot.blocked { background: repeating-linear-gradient(135deg, var(--soft), var(--soft) 8px, transparent 8px, transparent 16px); border-style: dashed; color: var(--muted); }
.agenda-slot.blocked b { color: var(--warn); }

/* Agenda semanal */
.wk-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--line); border-radius: 12px; }
.wk-grid { display: grid; grid-template-columns: 62px repeat(5, minmax(118px, 1fr)); min-width: 660px; }
.wk-grid > div { border-bottom: 1px solid var(--line); border-left: 1px solid var(--line); min-height: 38px; }
.wk-grid > div:nth-child(6n + 1) { border-left: 0; }
.wk-head { position: sticky; top: 0; z-index: 1; background: var(--soft); padding: 8px 6px; text-align: center; font-weight: 700; font-size: 12.5px; display: flex; flex-direction: column; gap: 2px; align-items: center; justify-content: center; }
.wk-head .link-btn { font-weight: 800; color: var(--text); }
.wk-head.today { background: var(--orange-soft); }
.wk-head.today .link-btn { color: var(--orange); }
.wk-off { color: var(--warn); font-weight: 600; font-size: 11px; line-height: 1.2; }
.wk-hora { display: flex; align-items: center; justify-content: center; font-size: 11.5px; color: var(--muted); background: var(--soft); }
.wk-cell { padding: 4px; display: flex; flex-direction: column; gap: 3px; justify-content: center; }
.wk-cell.past { background: var(--soft); opacity: .55; }
.wk-cell.off { background: repeating-linear-gradient(135deg, var(--soft), var(--soft) 6px, transparent 6px, transparent 12px); }
.wk-cell.busy span { font-size: 11px; color: var(--muted); text-align: center; }
.wk-cell.free button { width: 100%; height: 100%; min-height: 28px; border: 1px dashed transparent; border-radius: 8px; background: transparent; color: transparent; cursor: pointer; display: grid; place-items: center; }
.wk-cell.free button svg { width: 15px; height: 15px; }
.wk-cell.free:hover button, .wk-cell.free button:focus-visible { border-color: var(--turq); color: var(--turq-strong); background: var(--turq-soft); }
.wk-chip { display: block; width: 100%; text-align: left; border: 0; border-left: 3px solid var(--gray); border-radius: 7px; padding: 4px 6px; font: inherit; font-size: 11.5px; font-weight: 600; line-height: 1.25; background: var(--gray-bg); color: var(--text); cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wk-chip:hover { filter: brightness(.97); box-shadow: 0 0 0 2px var(--orange-soft); }
.wk-chip.st-pendiente { border-left-color: var(--warn); background: var(--warn-bg); }
.wk-chip.st-confirmada { border-left-color: var(--info); background: var(--info-bg); }
.wk-chip.st-atendida { border-left-color: var(--ok); background: var(--ok-bg); }
.wk-chip.st-no_asistio { border-left-color: var(--bad); background: var(--bad-bg); }
.wk-chip.urg { box-shadow: inset 0 0 0 1px var(--bad-line); }

/* Historial por colaborador */
.hist-list { list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.hist-item { border: 1px solid var(--line); border-left: 4px solid var(--gray-line); border-radius: 12px; padding: 10px 12px; background: var(--card); }
.hist-item.st-atendida { border-left-color: var(--ok); }
.hist-item.st-no_asistio { border-left-color: var(--bad); }
.hist-item.st-confirmada, .hist-item.st-pendiente { border-left-color: var(--info); }
.hist-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 12.5px; color: var(--muted); }
.hist-head .link-btn { font-weight: 800; color: var(--orange); }
.hist-body { margin-top: 6px; font-size: 13px; }
.hist-body p { margin: 4px 0 0; }
.hist-body small { color: var(--muted); font-weight: 700; }

/* Reportes */
.report-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; margin-top: 14px; }
.report-card { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: start; padding: 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); }
.report-card p { margin: 3px 0 0; font-size: 12.5px; color: var(--muted); }
.report-card .btn { grid-column: 1 / -1; justify-self: start; }
.report-ico { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--orange-soft); color: var(--orange); }
.card-head h3 svg { width: 18px; height: 18px; vertical-align: -3px; color: var(--orange); }

/* Aviso de nueva versión */
.update-bar { position: fixed; left: 50%; transform: translateX(-50%); bottom: 24px; z-index: 600; display: flex; align-items: center; gap: 10px; padding: 10px 10px 10px 16px; border-radius: 999px; background: #0D1B26; color: #EEF3F7; box-shadow: var(--shadow-lg); font-size: 13px; max-width: calc(100vw - 32px); }
.update-bar > svg { color: #FFC163; flex: 0 0 auto; }
.update-bar .icon-btn { color: #B9C8D3; }
@media (max-width: 760px) {
  .update-bar { left: 12px; right: 12px; transform: none; max-width: none; bottom: auto; top: calc(var(--header-h) + 8px + env(safe-area-inset-top)); border-radius: 16px; padding: 8px 8px 8px 12px; font-size: 12.5px; }
  .update-bar > span { flex: 1 1 auto; min-width: 0; }
  .wk-grid { grid-template-columns: 50px repeat(5, minmax(96px, 1fr)); min-width: 530px; }
}

/* Constancia de atención (solo al imprimir) */
#print-area { display: none; }
@media print {
  body.printing > *:not(#print-area) { display: none !important; }
  body.printing { background: #fff !important; }
  body.printing #print-area { display: block; color: #111; font-family: var(--font); font-size: 12pt; padding: 10mm 6mm; }
  #print-area .pc-head { display: flex; gap: 16px; align-items: center; border-bottom: 3px solid #F58020; padding-bottom: 12px; margin-bottom: 20px; }
  #print-area .pc-logo { width: 110px; height: 80px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  #print-area h1 { margin: 0; font-size: 20pt; color: #0B1E2D; }
  #print-area .pc-head p { margin: 4px 0 0; color: #555; }
  #print-area .pc-text { line-height: 1.6; }
  #print-area .pc-table { border-collapse: collapse; margin: 14px 0; min-width: 60%; }
  #print-area .pc-table th, #print-area .pc-table td { border: 1px solid #bbb; padding: 7px 10px; text-align: left; }
  #print-area .pc-table th { background: #f3f3f3; width: 45%; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  #print-area .pc-note { font-size: 10pt; color: #555; }
  #print-area .pc-firmas { display: flex; gap: 40px; margin-top: 70px; }
  #print-area .pc-firmas div { flex: 1; text-align: center; display: flex; flex-direction: column; gap: 4px; }
  #print-area .pc-firmas span { border-top: 1px solid #333; margin-bottom: 6px; }
  #print-area .pc-firmas small { color: #666; }
  #print-area .pc-foot { margin-top: 40px; font-size: 9pt; color: #777; }
}

/* ===================== v1.8 ===================== */
/* Nivel restante de un envase (gel, crema, frasco, rollo) */
.nivel-seg { display: flex; flex-wrap: wrap; gap: 6px; }
.nivel-seg label { position: relative; }
.nivel-seg input { position: absolute; opacity: 0; pointer-events: none; }
.nivel-seg span { display: inline-flex; align-items: center; min-height: 34px; padding: 6px 14px; border: 1px solid var(--input-line); border-radius: 999px; background: var(--input); color: var(--text); font-weight: 700; font-size: 13px; cursor: pointer; }
.nivel-seg span:hover { border-color: var(--turq); }
.nivel-seg input:checked + span { background: var(--turq-soft); border-color: var(--turq); color: var(--turq-strong); }
.nivel-seg .fin input:checked + span { background: var(--bad-bg); border-color: var(--bad-line); color: var(--bad); }
.nivel-seg input:focus-visible + span { outline: 2px solid var(--orange); outline-offset: 2px; }
.nivel-seg input:disabled + span { opacity: .5; cursor: default; }
/* Alta de artículo: forma de llevar el inventario y clave automática */
.opt-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.opt-cards label { position: relative; cursor: pointer; }
.opt-cards input { position: absolute; opacity: 0; pointer-events: none; }
.opt-cards span { display: flex; flex-direction: column; gap: 3px; height: 100%; padding: 11px 13px; border: 1px solid var(--input-line); border-radius: 12px; background: var(--input); }
.opt-cards small { color: var(--muted); font-size: 12px; line-height: 1.35; }
.opt-cards input:checked + span { border-color: var(--turq); background: var(--turq-soft); box-shadow: 0 0 0 1px var(--turq) inset; }
.opt-cards input:focus-visible + span { outline: 2px solid var(--orange); outline-offset: 2px; }
.clave-auto { display: flex; align-items: center; min-height: 42px; padding: 0 12px; border: 1px dashed var(--input-line); border-radius: 10px; background: var(--soft); font-weight: 800; color: var(--text); }

/* ===================== v1.10 ===================== */
/* "¿Cómo se lleva su inventario?" */
.modo-inv { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.field .modo-opt { position: relative; display: block; margin: 0; font-size: 13px; font-weight: 500; color: var(--text); cursor: pointer; }
.modo-opt input { position: absolute; opacity: 0; pointer-events: none; }
.modo-card { position: relative; display: flex; align-items: flex-start; gap: 12px; height: 100%; padding: 14px 44px 14px 14px; border: 1.5px solid var(--input-line); border-radius: 16px; background: var(--card); transition: border-color .15s, box-shadow .15s, transform .15s, background .15s; }
.modo-opt:hover .modo-card { border-color: var(--orange); box-shadow: 0 6px 18px rgba(245, 128, 32, .12); transform: translateY(-1px); }
.modo-ico { flex: 0 0 auto; width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; }
.modo-ico svg { width: 21px; height: 21px; }
.modo-ico.uni { background: var(--orange-soft); color: var(--orange); }
.modo-ico.env { background: var(--turq-soft); color: var(--turq-strong); }
.modo-txt { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.modo-txt b { font-size: 14px; font-weight: 800; color: var(--text); }
.modo-txt small { font-size: 12.5px; font-weight: 500; line-height: 1.4; color: var(--muted); }
.modo-txt em { margin-top: 4px; align-self: flex-start; font-style: normal; font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--soft); color: var(--muted); }
.modo-check { position: absolute; top: 12px; right: 12px; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--input-line); display: grid; place-items: center; color: transparent; background: var(--card); }
.modo-check svg { width: 13px; height: 13px; stroke-width: 3; }
.modo-opt input:checked + .modo-card { border-color: var(--turq); background: linear-gradient(135deg, var(--turq-soft), transparent 70%); box-shadow: 0 0 0 3px rgba(27, 199, 199, .14); }
.modo-opt input:checked + .modo-card .modo-check { background: var(--turq); border-color: var(--turq); color: #fff; }
.modo-opt input:checked + .modo-card em { background: var(--card); color: var(--turq-strong); }
.modo-opt input:focus-visible + .modo-card { outline: 2px solid var(--orange); outline-offset: 2px; }

/* Menús desplegables: primera letra en mayúscula */
.cs-val::first-letter, .cs-opt > span::first-letter { text-transform: uppercase; }
.cs-opt > span { display: block; }

/* ===================== v1.11 ===================== */
.notif-ajustes { margin-top: 12px; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--soft); font-size: 12.5px; }
.notif-ajustes summary { cursor: pointer; font-weight: 800; display: flex; align-items: center; gap: 8px; list-style: none; }
.notif-ajustes summary::-webkit-details-marker { display: none; }
.notif-ajustes summary svg { width: 16px; height: 16px; color: var(--orange); }
.notif-ajustes p { margin: 8px 0 0; line-height: 1.5; color: var(--muted); }
.notif-ajustes p b { color: var(--text); }

/* ===================== v1.12 ===================== */
/* Acciones clave del médico con color propio: Confirmar (verde) y No asistió (rojo) */
.icon-btn.fill-ok { background: #1BB56F; border-color: #1BB56F; color: #fff; box-shadow: 0 4px 12px rgba(27, 181, 111, .3); }
.icon-btn.fill-ok:hover { background: #15985C; border-color: #15985C; color: #fff; }
.icon-btn.fill-red { background: #E0464E; border-color: #E0464E; color: #fff; box-shadow: 0 4px 12px rgba(224, 70, 78, .3); }
.icon-btn.fill-red:hover { background: #C53039; border-color: #C53039; color: #fff; }
.btn.btn-confirmar { background: #1BB56F; border-color: #1BB56F; color: #fff; }
.btn.btn-confirmar:hover { background: #15985C; border-color: #15985C; color: #fff; }
.btn.btn-noasistio { background: #E0464E; border-color: #E0464E; color: #fff; }
.btn.btn-noasistio:hover { background: #C53039; border-color: #C53039; color: #fff; }

/* v1.14: hora libre del médico al agendar */
.hora-libre { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.hora-libre input[type="time"] { max-width: 170px; font-size: 16px; font-weight: 800; font-variant-numeric: tabular-nums; }

/* v1.16 · App instalada en pantalla completa
   - Android: display fullscreen; el encabezado incluye la zona segura superior (muesca).
   - Computadora: pantalla completa con la API Fullscreen (ver app.js). */
:root { --header-h: calc(72px + env(safe-area-inset-top, 0px)); }
@media (max-width: 720px) { :root { --header-h: calc(64px + env(safe-area-inset-top, 0px)); } }
.top { padding-top: env(safe-area-inset-top, 0px); }
@media (max-width: 760px) { .update-bar { top: calc(var(--header-h, 64px) + 8px); } }
.fs-btn { padding: 0; width: 40px; }

/* v1.18 · Buscador dentro del menú desplegable (data-buscar) */
.cs-buscar { position: sticky; top: -6px; z-index: 1; margin: -6px -6px 6px; padding: 8px; background: var(--card); border-bottom: 1px solid var(--line); }
.cs-buscar input { width: 100%; min-height: 38px; padding: 0 12px; border-radius: 10px; font-size: 16px; }
.cs-vacio { padding: 9px 11px; color: var(--muted); font-size: 13px; }
.at-med-acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }

/* =====================================================================
   v1.19 · Exámenes médicos de ingreso y egreso
   ===================================================================== */
.ex-btn { color: #fff; border: 0; font-weight: 800; }
.ex-btn svg { width: 19px; height: 19px; }
.ex-btn.ex-ingreso { background: linear-gradient(135deg, #15803D, #22A355); box-shadow: 0 7px 16px rgba(21, 128, 61, .26); }
.ex-btn.ex-egreso { background: linear-gradient(135deg, #3F4E5F, #6B7D91); box-shadow: 0 7px 16px rgba(63, 78, 95, .25); }
.ex-btn:hover:not(:disabled) { color: #fff; filter: brightness(1.06); transform: translateY(-1px); }
.avail-cta.con-examenes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: auto auto; grid-auto-flow: column; gap: 8px; }
.avail-cta.con-examenes .btn { margin-top: 0; min-height: 48px; justify-content: center; white-space: nowrap; }
@media (max-width: 1100px) { .avail { grid-template-columns: auto minmax(0, 1fr); } .avail-cta.con-examenes { grid-column: 1 / -1; } }
@media (max-width: 560px) { .avail-cta.con-examenes { grid-template-columns: minmax(0, 1fr); grid-auto-flow: row; grid-template-rows: none; } }
.ex-acts .ex-btn { min-height: 42px; }

/* Encabezado del formulario */
.ex-form-head { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 14px; margin-bottom: 14px; color: #fff; }
.ex-form-head svg { width: 28px; height: 28px; flex: 0 0 auto; }
.ex-form-head b { display: block; font-size: 15px; }
.ex-form-head small { opacity: .9; }
.ex-form-head.ex-ingreso { background: linear-gradient(135deg, #15803D, #22A355); }
.ex-form-head.ex-egreso { background: linear-gradient(135deg, #3F4E5F, #6B7D91); }

/* Resultado en grande */
.ex-res { display: flex; gap: 14px; align-items: center; padding: 14px 16px; border-radius: 16px; border: 2px solid; margin-bottom: 14px; }
.ex-res svg { width: 34px; height: 34px; flex: 0 0 auto; }
.ex-res small { display: block; font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; opacity: .8; }
.ex-res b { display: block; font-size: 20px; line-height: 1.15; }
.ex-res span { font-size: 13px; }
.ex-res.lg { padding: 20px 22px; }
.ex-res.lg svg { width: 48px; height: 48px; }
.ex-res.lg b { font-size: clamp(22px, 4vw, 30px); font-weight: 900; letter-spacing: -.01em; }
.ex-res.ok { background: rgba(22, 163, 74, .1); border-color: rgba(22, 163, 74, .45); color: #15803D; }
.ex-res.bad { background: rgba(224, 70, 78, .1); border-color: rgba(224, 70, 78, .5); color: #C53039; }
.ex-res.warn { background: rgba(245, 158, 11, .12); border-color: rgba(245, 158, 11, .5); color: #A45B00; }
.ex-res.info { background: rgba(27, 199, 199, .12); border-color: rgba(27, 199, 199, .5); color: #0B7F7F; }
:root[data-theme="dark"] .ex-res.ok { color: #4ADE80; }
:root[data-theme="dark"] .ex-res.bad { color: #FF8A8F; }
:root[data-theme="dark"] .ex-res.warn { color: #FFC163; }
:root[data-theme="dark"] .ex-res.info { color: #5EE6E6; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .ex-res.ok { color: #4ADE80; }
  :root:not([data-theme="light"]) .ex-res.bad { color: #FF8A8F; }
  :root:not([data-theme="light"]) .ex-res.warn { color: #FFC163; }
  :root:not([data-theme="light"]) .ex-res.info { color: #5EE6E6; }
}
.ex-obs { border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 14px; background: var(--soft); }
.ex-obs small { font-size: 11px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.ex-obs p { margin: 4px 0 0; white-space: pre-wrap; }

/* Opciones de resultado */
.ex-lead { font-weight: 700; margin: 0 0 10px; }
.ex-opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
@media (max-width: 640px) { .ex-opts { grid-template-columns: minmax(0, 1fr); } }
.ex-opt { position: relative; cursor: pointer; }
.ex-opt input { position: absolute; opacity: 0; pointer-events: none; }
.ex-opt-card { display: flex; gap: 10px; align-items: flex-start; height: 100%; padding: 12px 14px; border: 2px solid var(--line); border-radius: 14px; background: var(--card); transition: border-color .15s, box-shadow .15s, background .15s; }
.ex-opt-card svg { width: 26px; height: 26px; flex: 0 0 auto; }
.ex-opt-card b { display: block; font-size: 14.5px; }
.ex-opt-card small { color: var(--muted); }
.ex-opt.ok svg { color: #16A34A; }
.ex-opt.bad svg { color: #E0464E; }
.ex-opt.warn svg { color: #D97706; }
.ex-opt.info svg { color: #0E9F9F; }
.ex-opt input:focus-visible + .ex-opt-card { box-shadow: 0 0 0 3px rgba(27, 199, 199, .25); }
.ex-opt.ok input:checked + .ex-opt-card { border-color: #16A34A; background: rgba(22, 163, 74, .08); }
.ex-opt.bad input:checked + .ex-opt-card { border-color: #E0464E; background: rgba(224, 70, 78, .08); }
.ex-opt.warn input:checked + .ex-opt-card { border-color: #D97706; background: rgba(245, 158, 11, .1); }
.ex-opt.info input:checked + .ex-opt-card { border-color: #0E9F9F; background: rgba(27, 199, 199, .1); }

/* Constancia de examen (impresión / PDF) */
@media print {
  @page { size: letter; margin: 12mm 14mm; }
  #print-area.exd { padding: 0; font-size: 10.5pt; color: #1a1f24; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .exd-head { display: grid; grid-template-columns: 120px 1fr auto; gap: 16px; align-items: center; padding-bottom: 12px; border-bottom: 4px solid #F58020; }
  .exd-logo { width: 120px; height: 86px; }
  .exd-titulo small { display: block; color: #0E9F9F; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; font-size: 8.5pt; }
  .exd-titulo h1 { margin: 2px 0; font-size: 17pt; line-height: 1.15; color: #0B1E2D; }
  .exd-titulo p { margin: 0; color: #5b6670; }
  .exd-folio { text-align: center; border: 1.5px solid #0B1E2D; border-radius: 10px; padding: 8px 14px; min-width: 110px; }
  .exd-folio small { display: block; font-size: 7.5pt; letter-spacing: .1em; text-transform: uppercase; color: #5b6670; }
  .exd-folio b { display: block; font-size: 14pt; color: #0B1E2D; }
  .exd-folio span { font-size: 8.5pt; color: #5b6670; }
  .exd-sec { margin-top: 16px; }
  .exd-sec h2 { margin: 0 0 8px; padding: 5px 10px; background: #0B1E2D; color: #fff; font-size: 9.5pt; letter-spacing: .1em; text-transform: uppercase; border-radius: 4px; }
  .exd-tabla { width: 100%; border-collapse: collapse; }
  .exd-tabla th, .exd-tabla td { border: 1px solid #c9d1d8; padding: 6px 9px; text-align: left; vertical-align: top; }
  .exd-tabla th { width: 20%; background: #f1f4f6; font-size: 8.5pt; text-transform: uppercase; letter-spacing: .04em; color: #44505a; }
  .exd-lead { margin: 4px 0 10px; line-height: 1.5; }
  .exd-res { border: 3px solid; border-radius: 12px; padding: 14px 18px; text-align: center; }
  .exd-res b { display: block; font-size: 22pt; font-weight: 900; letter-spacing: .02em; text-transform: uppercase; line-height: 1.1; }
  .exd-res span { display: block; margin-top: 4px; font-size: 11pt; }
  .exd-res.ok { border-color: #16A34A; color: #12692F; background: #ECFDF3; }
  .exd-res.bad { border-color: #DC2626; color: #A61B1B; background: #FEF2F2; }
  .exd-res.warn { border-color: #D97706; color: #8A4B00; background: #FFF8EB; }
  .exd-res.info { border-color: #0E9F9F; color: #0A6B6B; background: #ECFEFE; }
  .exd-obs { margin-top: 12px; border: 1px solid #c9d1d8; border-left: 5px solid #F58020; border-radius: 6px; padding: 8px 12px; }
  .exd-obs h3 { margin: 0 0 4px; font-size: 9pt; text-transform: uppercase; letter-spacing: .06em; color: #44505a; }
  .exd-obs p { margin: 0; white-space: pre-wrap; line-height: 1.45; }
  .exd-firmas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; margin-top: 64px; text-align: center; }
  .exd-firmas div { display: flex; flex-direction: column; gap: 2px; }
  .exd-firmas span { border-top: 1.5px solid #1a1f24; margin-bottom: 6px; }
  .exd-firmas b { font-size: 10pt; min-height: 1.2em; }
  .exd-firmas small { color: #5b6670; font-size: 8.5pt; }
  .exd-pie { display: flex; flex-direction: column; gap: 2px; margin-top: 34px; padding-top: 8px; border-top: 1px solid #c9d1d8; font-size: 7.8pt; color: #6b7680; }
}

/* =====================================================================
   v1.20 · Filas clicables, bitácora con foto y gráficas ampliadas
   ===================================================================== */
:root[data-theme="dark"] .ex-btn { box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .16); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .ex-btn { box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .16); } }

/* Fila completa abre el detalle */
.table tbody tr.row-click { cursor: pointer; }
.table tbody tr.row-click:hover td { background: var(--soft); }

/* Bitácora */
.table td.col-desc, .table td.col-desc .td-in { text-align: left; justify-content: flex-start; }
.bit-desc { display: block; line-height: 1.4; font-size: 13.5px; min-width: 220px; }
.bit-desc b { font-weight: 700; }
.bit-sistema { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--soft); color: var(--muted); }
.bit-sistema svg { width: 16px; height: 16px; }
.bit-head { display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--soft); margin-bottom: 14px; }
.bit-head .bit-desc { margin: 0; font-size: 14.5px; min-width: 0; }

/* Gráfica: indicador para ampliar */
.chart-box[tabindex] { cursor: zoom-in; border-radius: 12px; outline: none; }
.chart-box[tabindex]:focus-visible { box-shadow: 0 0 0 3px rgba(245, 128, 32, .35); }
.chart-box[tabindex]::after {

   ===================================================================== */
/* Recetas: color característico */
.receta-chip { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 900; letter-spacing: .04em;
  color: #fff; background: var(--rc, #64748B); white-space: nowrap; }
.swatch { display: inline-block; width: 22px; height: 22px; border-radius: 7px; background: var(--rc); box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .5); }
.color-pick { display: flex; flex-wrap: wrap; gap: 6px; }
.color-pick button { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--card); font-size: 12.5px; font-weight: 700; }
.color-pick button span { width: 14px; height: 14px; border-radius: 50%; background: var(--rc); }
.color-pick button.on { border-color: var(--rc); box-shadow: 0 0 0 3px color-mix(in srgb, var(--rc) 22%, transparent); }
.receta-sep { border-left-color: var(--rc, var(--orange)); }
.receta-sep .rs-code { background: var(--rc, var(--turq)); color: #fff; }
.rs-especie { font-size: 12px; font-weight: 800; padding: 3px 9px; border-radius: 999px; background: rgba(255, 255, 255, .14); color: #fff; }
.date-chip[style*="--rc"] { border-left: 3px solid var(--rc); }

/* Áreas de análisis */
.area-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--ac, #64748B); margin-right: 6px; vertical-align: middle; flex: 0 0 auto; }
.area-chip { display: inline-flex; align-items: center; gap: 0; font-weight: 800; font-size: 12.5px; white-space: nowrap; }
.table tr.area-row td { background: var(--soft); text-align: left; font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 6px 10px; }
.area-progreso { display: flex; flex-wrap: wrap; gap: 6px; }
.area-progreso .ap { display: inline-flex; align-items: center; gap: 5px; padding: 5px 9px; border-radius: 10px; font-size: 11.5px; border: 1px solid var(--line);
  background: color-mix(in srgb, var(--ac) 9%, var(--card)); border-left: 3px solid var(--ac); }
.area-progreso .ap svg.lucide { width: 13px; height: 13px; }
.area-progreso .ap.ok svg { color: var(--ok); } .area-progreso .ap.warn svg { color: var(--warn); } .area-progreso .ap.bad svg { color: var(--bad); }
.area-progreso .ap small { color: var(--muted); font-weight: 700; }
.liberado-info { display: flex; align-items: center; gap: 8px; padding: 8px 11px; border-radius: 11px; background: var(--ok-bg); border: 1px solid var(--ok-line); color: var(--ok); font-size: 12.5px; }
.liberado-info b { color: inherit; }
.lote-card.est-liberado { border-top-color: #16A34A; } .lote-card.est-listo { border-top-color: #1BC7C7; }
.lote-card.est-en_proceso { border-top-color: #F59E0B; } .lote-card.est-no_conforme { border-top-color: #E0464E; }
.lote-card { border-left: 4px solid var(--rc, transparent); }
.lote-acts { flex-wrap: wrap; }
.lote-resumen button.chip-stat { cursor: pointer; font: inherit; font-size: 12px; }
.lote-resumen button.chip-stat:hover { border-color: var(--turq); }
.chip-stat.est-liberado svg { color: #16A34A; } .chip-stat.est-listo svg { color: #0FA3A6; }
.chip-stat.est-en_proceso svg { color: #D97706; } .chip-stat.est-no_conforme svg { color: #E0464E; }
ul.lib-areas { list-style: none; margin: 4px 0 10px; padding: 0; display: grid; gap: 6px; }
ul.lib-areas li { display: flex; align-items: center; gap: 4px; font-size: 13px; }

/* Formulario: secciones por área y verificación Cumple / No cumple */
.area-sec { border: 1px solid var(--line); border-left: 4px solid var(--ac); border-radius: 13px; padding: 10px 12px 12px; margin-bottom: 12px; background: color-mix(in srgb, var(--ac) 4%, var(--card)); }
.area-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.area-head .area-dot { background: var(--ac); width: 12px; height: 12px; }
.area-head b { font-size: 14px; }
.area-head small { color: var(--muted); }
.area-head .link-btn, .area-head .pill { margin-left: auto; display: inline-flex; align-items: center; gap: 5px; }
.area-sec.solo-lectura .metodo-card { opacity: .62; }
.metodo-card.bloq .mc-head { cursor: not-allowed; }
.seg-check { display: inline-flex; flex: 1; border: 1px solid var(--input-line); border-radius: 10px; overflow: hidden; background: var(--input); }
.seg-check button { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; border: 0; background: none; font-weight: 800; font-size: 13px; color: var(--muted); }
.seg-check button + button { border-left: 1px solid var(--input-line); }
.seg-check button.on.ok { background: var(--ok-bg); color: var(--ok); }
.seg-check button.on.bad { background: var(--bad-bg); color: var(--bad); }
.metodo-card.bloq .seg-check button { cursor: not-allowed; }
.cal-sem span { font-size: 8.4px; letter-spacing: -.01em; overflow: hidden; text-overflow: clip; white-space: nowrap; }

/* Especificaciones: métodos que no aplican */
.table tr.no-aplica td { opacity: .6; }
.check-list { display: flex; flex-wrap: wrap; gap: 14px; }

/* Usuarios: fotos alineadas en una columna centrada */
.table td.col-usuario .td-in { display: flex; justify-content: center; }
.user-cell.alineada { width: 250px; max-width: 100%; justify-content: flex-start; text-align: left; }
.user-cell.alineada .avatar { flex: 0 0 auto; }
.user-txt { display: flex; flex-direction: column; min-width: 0; line-height: 1.25; }
.user-txt b { overflow-wrap: anywhere; }
.user-txt small { color: var(--muted); font-size: 11.5px; }
.user-txt small.tu { color: var(--info); font-weight: 800; }
@media (max-width: 720px) { .user-cell.alineada { width: auto; justify-content: flex-end; text-align: right; } .table td.col-usuario .td-in { justify-content: flex-end; } }

/* Agregar usuario: búsqueda de cuentas */
.search-field { position: relative; }
.search-field svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); width: 16px; height: 16px; }
.search-field input { padding-left: 36px !important; }
.cuentas { display: grid; gap: 6px; max-height: 260px; overflow: auto; margin: 4px 0 10px; }
.cuenta { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--card); text-align: left; }
.cuenta:hover:not([disabled]) { border-color: var(--turq); }
.cuenta.sel { border-color: var(--orange); box-shadow: 0 0 0 3px var(--orange-soft); }
.cuenta.ya { opacity: .6; cursor: not-allowed; }
.cuenta .user-txt { flex: 1; }
.cuenta-est small { color: var(--muted); font-size: 11px; }
.trend-stats .ok-stat b { color: var(--ok); }
.lote-det summary { cursor: pointer; list-style: none; display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 800; color: var(--turq-strong); padding: 4px 0; }
.lote-det summary::-webkit-details-marker { display: none; }
.lote-det summary svg { transition: transform .15s; }
.lote-det[open] summary svg { transform: rotate(180deg); }
.lote-det[open] summary { margin-bottom: 8px; }
.toolbar .search { min-width: 260px; }
.ag-datos .photo-pick .avatar.xl { width: 72px; height: 72px; font-size: 22px; }
.ag-datos .photo-pick { margin: 6px 0 4px; }

/* =====================================================================
   Liberación de producto v8.0
   ===================================================================== */
/* KPIs: el ícono y la barra lateral comparten color */
.kpi.k-orange::before { background: #F58020; } .kpi.k-orange .kpi-ico { background: linear-gradient(135deg, #F58020, #FFB15C) !important; }
.kpi.k-blue::before { background: #2563EB; } .kpi.k-blue .kpi-ico { background: linear-gradient(135deg, #2563EB, #60A5FA) !important; }
.kpi.k-green::before { background: #16A34A; } .kpi.k-green .kpi-ico { background: linear-gradient(135deg, #16A34A, #4ADE80) !important; }
.kpi.k-red::before { background: #E0464E; } .kpi.k-red .kpi-ico { background: linear-gradient(135deg, #DC2626, #F87171) !important; }

/* Fecha en las listas del panel: el mes completo cabe en el recuadro */
.date-chip { width: 66px; padding: 5px 2px; }
.date-chip small { font-size: 8.6px; letter-spacing: 0; text-transform: none; white-space: nowrap; }
.cal-sem span { font-size: 11px; font-weight: 800; }

/* Recuadros de estadística de cada gráfica: centrados, sin mayúsculas, sin desbordarse */
.trend-stats { grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); }
.trend-stats span { align-items: center; justify-content: center; text-align: center; padding: 8px 6px; gap: 3px; }
.trend-stats small { text-transform: none; letter-spacing: 0; font-size: 11px; line-height: 1.2; }
.trend-stats b { font-size: clamp(11.5px, 1.05vw, 14px); line-height: 1.2; overflow-wrap: anywhere; }

/* Casillas con el estilo del sistema */
.opt-list { display: flex; flex-wrap: wrap; gap: 8px; }
.opt-check { position: relative; display: inline-flex; align-items: center; gap: 9px; padding: 8px 12px; border: 1.5px solid var(--line); border-radius: 11px; background: var(--card); cursor: pointer; font-weight: 700; font-size: 13px; color: var(--text); }
.opt-check:hover { border-color: var(--turq); }
.opt-check input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.opt-check input:checked + .mc-box { background: var(--orange); border-color: var(--orange); color: #fff; }
.opt-check input:focus-visible + .mc-box { outline: 3px solid rgba(27, 199, 199, .55); outline-offset: 2px; }
.opt-check:has(input:checked) { border-color: var(--orange); background: var(--orange-soft); }
.opt-check .area-dot, .opt-check .receta-dot { margin-right: 6px; }
.recetas-opt { margin-top: 8px; }

/* Recetas: nombre con su color, código y especie sin «nube» de color */
.receta-nom { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.receta-nom.sm { font-size: 12px; font-weight: 700; }
.receta-dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; background: var(--rc, #64748B); flex: 0 0 auto; box-shadow: 0 0 0 3px color-mix(in srgb, var(--rc, #64748B) 22%, transparent); }
.codigo { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12.5px; font-weight: 700; color: var(--muted); letter-spacing: .02em; }
.especie { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; }
.especie svg.lucide { width: 16px; height: 16px; color: var(--orange); }
.td-in.num { font-variant-numeric: tabular-nums; font-weight: 800; }
.recetas-mini { display: inline-flex; flex-wrap: wrap; gap: 6px 12px; justify-content: center; }
.chips-areas { display: inline-flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.cs-lbl, .cs-val { display: inline-flex; align-items: center; gap: 8px; }
.cs-lbl svg.lucide, .cs-val svg.lucide { width: 16px; height: 16px; color: var(--orange); }

/* Usuarios (como en Servicio médico) */
.table th.col-user, .table td.col-user { text-align: left; padding-left: 22px; }
.table td.col-user .user-cell { justify-content: flex-start; text-align: left; }
.puesto-txt { display: inline-flex; flex-direction: column; align-items: center; line-height: 1.25; }
.puesto-txt b { font-size: 12.5px; font-weight: 800; }
.puesto-txt small { color: var(--muted); font-size: 11.5px; }
.table tr.inactivo td { opacity: .6; }
.table th.sortable { cursor: pointer; user-select: none; white-space: nowrap; }
.table th.sortable:hover { color: var(--text); }
.sort-ico { margin-left: 5px; font-size: 10px; color: var(--muted); }
.table th.sorted .sort-ico { color: var(--orange); }
.avatares { display: inline-flex; align-items: center; }
.avatares .avatar { width: 30px; height: 30px; font-size: 11px; box-shadow: 0 0 0 2px var(--card); }
.avatares .avatar + .avatar { margin-left: -8px; }
.avatares .mas { margin-left: 6px; font-size: 12px; font-weight: 800; color: var(--muted); }
@media (max-width: 720px) { .table-wrap.responsive td.col-user { padding-left: 10px; text-align: right; } .table-wrap.responsive td.col-user .user-cell { justify-content: flex-end; } }

/* Persona con foto (tablas y tarjetas) */
.persona { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; text-align: left; }
.persona .avatar.sm { width: 28px; height: 28px; font-size: 10.5px; }
.persona small { display: block; font-size: 10.5px; color: var(--muted); line-height: 1.1; }
.persona b { font-size: 12.5px; }
.lote-gente { display: flex; flex-wrap: wrap; gap: 8px 18px; padding: 8px 10px; border-radius: 12px; background: var(--soft); border: 1px solid var(--line); }
.lote-receta { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; margin: 4px 0 0; }
.lote-receta .especie { color: var(--muted); font-size: 13px; }

/* Detalle de resultados: cada registro en una sola línea */
.tabla-una-linea { font-size: 12.5px; }
.tabla-una-linea th { white-space: nowrap; }
.tabla-una-linea td .td-in { white-space: nowrap; }
.tabla-una-linea .area-dot { margin-right: 5px; }
.tabla-una-linea .pill { font-size: 11px; padding: 3px 9px; }
@media (max-width: 720px) { .tabla-una-linea td .td-in { white-space: normal; } }

/* Separador de receta en Resultados */
.receta-sep .rs-cod { font-family: ui-monospace, Consolas, monospace; font-size: 12px; font-weight: 700; opacity: .8; }
.rs-especie { display: inline-flex; align-items: center; gap: 5px; }
.rs-especie svg.lucide { width: 14px; height: 14px; }

/* Firmas del certificado */
.firmas-pick { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px; border: 1px dashed var(--line); border-radius: 14px; background: var(--soft); margin: 4px 0 8px; }
.firmas-pick label { display: inline-flex; align-items: center; gap: 6px; }
.firmas-pick label svg.lucide { width: 15px; height: 15px; color: var(--orange); }
@media (max-width: 600px) { .firmas-pick { grid-template-columns: 1fr; } }

/* Bitácora */
.toolbar .date-range { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
.bitacora-tabla td.col-desc, .bitacora-tabla th:nth-child(5) { text-align: left; }
.bitacora-tabla tr.clickable { cursor: pointer; }
.bit-desc { display: block; line-height: 1.45; font-size: 13px; min-width: 260px; }
.bit-desc b { font-weight: 700; }
.bit-sistema { display: grid; place-items: center; background: var(--soft) !important; color: var(--muted) !important; }
.bit-sistema svg { width: 16px; height: 16px; }
.bit-head { display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--soft); margin-bottom: 14px; }
.bit-head .bit-desc { margin: 0; font-size: 14px; min-width: 0; }
.diff { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.diff td, .diff th { border-bottom: 1px solid var(--line); padding: 7px 8px; text-align: center; vertical-align: top; overflow-wrap: anywhere; }
.diff th { color: var(--muted); font-size: 11px; }
.diff .old { color: var(--bad); }
.diff .new { color: var(--ok); }
.pill.xs { font-size: 10.5px; padding: 2px 8px; }

/* Tarjetas de gráficas: ícono de color, acento superior y lienzo con fondo suave */
.chart-card { position: relative; overflow: hidden; }
.chart-card::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 4px; background: linear-gradient(90deg, var(--cc), color-mix(in srgb, var(--cc) 35%, transparent)); }
.chart-card .card-head.center { gap: 6px; }
.cc-ico { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; color: #fff; background: linear-gradient(135deg, var(--cc), color-mix(in srgb, var(--cc) 70%, #fff)); box-shadow: 0 8px 18px color-mix(in srgb, var(--cc) 30%, transparent); }
.cc-ico svg.lucide { width: 19px; height: 19px; }
.chart-card .chart-box, .trend-card .chart-box { padding: 10px 8px 4px; border-radius: 14px; background: radial-gradient(120% 90% at 50% 0%, color-mix(in srgb, var(--soft) 70%, transparent), transparent 70%); }
.trend-card { position: relative; overflow: hidden; }
.trend-card::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; background: linear-gradient(90deg, var(--orange), #1BC7C7); opacity: .85; }
.chart-card, .trend-card { transition: box-shadow .18s, transform .18s; }
.chart-card:hover, .trend-card:hover { box-shadow: 0 16px 34px rgba(15, 35, 50, .10); }

/* Botones de colores (no todos naranjas): sólidos c-* y suaves s-* */
.btn.c-blue, .btn.c-green, .btn.c-teal, .btn.c-purple, .btn.c-red { color: #fff; border-color: transparent; }
.btn.c-blue { background: linear-gradient(135deg, #2563EB, #3B82F6); box-shadow: 0 7px 16px rgba(37, 99, 235, .24); }
.btn.c-green { background: linear-gradient(135deg, #15803D, #22C55E); box-shadow: 0 7px 16px rgba(22, 163, 74, .24); }
.btn.c-teal { background: linear-gradient(135deg, #0E8F96, #1BC7C7); box-shadow: 0 7px 16px rgba(14, 143, 150, .24); }
.btn.c-purple { background: linear-gradient(135deg, #6D28D9, #8B5CF6); box-shadow: 0 7px 16px rgba(109, 40, 217, .24); }
.btn.c-red { background: linear-gradient(135deg, #C81E1E, #EF4444); box-shadow: 0 7px 16px rgba(200, 30, 30, .22); }
.btn.c-blue:hover, .btn.c-green:hover, .btn.c-teal:hover, .btn.c-purple:hover, .btn.c-red:hover { filter: brightness(1.06); transform: translateY(-1px); }
.btn.s-green, .btn.s-red, .btn.s-purple, .btn.s-amber, .btn.s-blue { border: 1px solid transparent; }
.btn.s-green { background: #E8F7EE; color: #15803D; border-color: #BFE8CF; }
.btn.s-red { background: #FDECEC; color: #B91C1C; border-color: #F6C9C9; }
.btn.s-purple { background: #F1EBFE; color: #6D28D9; border-color: #DCCDFB; }
.btn.s-amber { background: #FFF4E5; color: #B45309; border-color: #FBDDB0; }
.btn.s-blue { background: #E8F0FE; color: #1D4ED8; border-color: #C7D8FB; }
.btn.s-green:hover, .btn.s-red:hover, .btn.s-purple:hover, .btn.s-amber:hover, .btn.s-blue:hover { filter: saturate(1.3) brightness(.98); }
:root[data-theme="dark"] .btn.s-green { background: rgba(34, 197, 94, .14); color: #4ADE80; border-color: rgba(34, 197, 94, .3); }
:root[data-theme="dark"] .btn.s-red { background: rgba(239, 68, 68, .14); color: #FCA5A5; border-color: rgba(239, 68, 68, .3); }
:root[data-theme="dark"] .btn.s-purple { background: rgba(139, 92, 246, .16); color: #C4B5FD; border-color: rgba(139, 92, 246, .32); }
:root[data-theme="dark"] .btn.s-amber { background: rgba(245, 158, 11, .14); color: #FCD34D; border-color: rgba(245, 158, 11, .3); }
:root[data-theme="dark"] .btn.s-blue { background: rgba(59, 130, 246, .15); color: #93C5FD; border-color: rgba(59, 130, 246, .32); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .btn.s-green { background: rgba(34, 197, 94, .14); color: #4ADE80; border-color: rgba(34, 197, 94, .3); }
  :root:not([data-theme="light"]) .btn.s-red { background: rgba(239, 68, 68, .14); color: #FCA5A5; border-color: rgba(239, 68, 68, .3); }
  :root:not([data-theme="light"]) .btn.s-purple { background: rgba(139, 92, 246, .16); color: #C4B5FD; border-color: rgba(139, 92, 246, .32); }
  :root:not([data-theme="light"]) .btn.s-amber { background: rgba(245, 158, 11, .14); color: #FCD34D; border-color: rgba(245, 158, 11, .3); }
  :root:not([data-theme="light"]) .btn.s-blue { background: rgba(59, 130, 246, .15); color: #93C5FD; border-color: rgba(59, 130, 246, .32); }
}

/* Puestos que capturan cada área: un color por puesto */
.puesto-chip { --pc: #64748B; display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 700; white-space: nowrap;
  color: color-mix(in srgb, var(--pc) 82%, #000); background: color-mix(in srgb, var(--pc) 13%, transparent); border: 1px solid color-mix(in srgb, var(--pc) 32%, transparent); }
.puesto-chip svg.lucide { width: 13px; height: 13px; }
.puesto-chip.admin { --pc: #475569; }
:root[data-theme="dark"] .puesto-chip { color: color-mix(in srgb, var(--pc) 55%, #fff); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .puesto-chip { color: color-mix(in srgb, var(--pc) 55%, #fff); } }
.chips-areas { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }

/* Bitácora: tabla, encabezados y celdas centrados, letra más compacta */
.bitacora-tabla { margin: 0 auto; }
.bitacora-tabla th, .bitacora-tabla td, .bitacora-tabla td.col-desc, .bitacora-tabla th:nth-child(5) { text-align: center !important; vertical-align: middle; }
.bitacora-tabla th { font-size: 10px; padding: 10px 8px; }
.bitacora-tabla td { font-size: 12px; padding: 8px; }
.bitacora-tabla .td-in { justify-content: center; text-align: center; }
.bitacora-tabla .user-cell { justify-content: center; margin: 0 auto; width: max-content; max-width: 100%; text-align: left; }
.bitacora-tabla .user-txt b { font-size: 12px; }
.bitacora-tabla .user-txt small { font-size: 10.5px; }
.bitacora-tabla .bit-desc { font-size: 12px; min-width: 220px; text-align: center; }
.bitacora-tabla .pill { font-size: 10.5px; padding: 3px 8px; }
.bitacora-tabla .mono { font-size: 11.5px; }
@media (max-width: 720px) { .bitacora-tabla .td-in, .bitacora-tabla .bit-desc { text-align: right; justify-content: flex-end; } .bitacora-tabla .user-cell { margin: 0 0 0 auto; } }

/* Mi perfil: seis recuadros */
.p-tile b.p-mail { font-size: 13.5px; word-break: break-all; }
.p-tile b.p-perm { font-size: 12.5px; line-height: 1.45; font-weight: 700; }

function errMsg(err) {
  if (!err) return 'Ocurrió un error inesperado.';
  const msg = err.message || String(err);
  for (const [k, v] of Object.entries(CONSTRAINT_MSG)) if (msg.includes(k) || err.details?.includes?.(k)) return v;
  if (err.code === '23505') return 'El registro ya existe (dato duplicado).';
  if (err.code === '23503') return 'No se puede eliminar porque tiene registros relacionados. Puede desactivarlo en su lugar.';
  if (err.code === '23514') return 'Algún dato no cumple las reglas de validación.';
  if (err.code === '42501') return msg.includes('permission denied') || msg.includes('row-level security') ? 'No tiene permiso para realizar esta acción.' : msg;
  if (err.code === 'P0001') return msg;
  if (/row-level security|permission denied|Unauthorized/i.test(msg)) return 'No tiene permiso para realizar esta acción.';
  if (/exceeded the maximum allowed size|Payload too large/i.test(msg)) return 'El archivo es demasiado grande.';
  if (err.code === 'PGRST301' || /JWT expired|invalid JWT/i.test(msg)) return 'Su sesión expiró. Vuelva a iniciar sesión.';
  if (/Failed to fetch|NetworkError|Load failed|network/i.test(msg)) return 'No hay conexión con el servidor. Verifique su red e intente de nuevo.';
  return msg;
}

// ---------- Modales ----------
let modalDepth = 0;
function openModal({ title, subtitle = '', body = '', submitText = 'Guardar', onSubmit = null, size = '', danger = false, onOpen = null, confirmDiscard = true }) {
  return new Promise((resolve) => {
    const root = document.getElementById('modal-root');
    const wrap = document.createElement('div');
    wrap.className = 'modal';
    wrap.innerHTML = `
      <form class="modal-box ${size}" role="dialog" aria-modal="true" aria-labelledby="mt-${modalDepth}" novalidate>
        <header class="modal-head">
          <div><h3 id="mt-${modalDepth}">${esc(title)}</h3>${subtitle ? `<p>${esc(subtitle)}</p>` : ''}</div>
          <button type="button" class="icon-btn" data-close aria-label="Cerrar">${icon('x')}</button>
        </header>
        <div class="modal-body">${body}</div>
        <footer class="modal-foot">
          ${onSubmit
            ? `<div class="form-error" role="alert"></div>
               <button type="button" class="btn secondary" data-close>Cancelar</button>
               <button type="submit" class="btn ${danger ? 'danger' : 'primary'}" data-submit>${esc(submitText)}</button>`
            : `<button type="button" class="btn secondary" data-close>Cerrar</button>`}
        </footer>
      </form>`;
    modalDepth++;
    root.appendChild(wrap);
    document.body.classList.add('modal-open');
    const form = wrap.querySelector('form');
    const errBox = wrap.querySelector('.form-error');
    let dirty = false, busy = false, result;
    form.addEventListener('input', () => { dirty = true; });

    const finish = () => {
      csCerrar();
      wrap.remove(); modalDepth--;
      document.removeEventListener('keydown', onKey);
      if (!root.children.length) document.body.classList.remove('modal-open');
      resolve(result);
    };
    const close = async (force = false) => {
      if (busy) return;
      if (!force && dirty && onSubmit && confirmDiscard) {
        const ok = await confirmDialog({ title: '¿Descartar cambios?', message: 'Hay información capturada que no se ha guardado.', confirmText: 'Descartar', danger: true });
        if (!ok) return;
      }
      finish();
    };
    const onKey = (e) => { if (e.key === 'Escape' && root.lastElementChild === wrap) { e.preventDefault(); close(); } };
    document.addEventListener('keydown', onKey);
    wrap.addEventListener('click', (e) => { if (e.target.closest('[data-close]')) close(); });

    const ctx = {
      form, wrap,
      setError: (m) => { if (errBox) errBox.textContent = m || ''; },
      close: (value) => { result = value; finish(); },
    };
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!onSubmit || busy) return;
      ctx.setError('');
      const btn = form.querySelector('[data-submit]');
      busy = true; btn.disabled = true;
      const label = btn.innerHTML; btn.innerHTML = `<span class="spinner sm"></span> Guardando…`;
      try {
        const r = await onSubmit(ctx);
        if (r !== false) { result = r === undefined ? true : r; busy = false; finish(); return; }
      } catch (err) {
        console.error(err);
        ctx.setError(errMsg(err));
      }
      busy = false; btn.disabled = false; btn.innerHTML = label; refreshIcons();
    });
    refreshIcons();
    onOpen?.(ctx);
    setTimeout(() => form.querySelector('input:not([type=hidden]):not([disabled]), select, textarea')?.focus({ preventScroll: true }), 30);
  });
}

// Confirmación (opcionalmente con texto obligatorio, p. ej. motivo de cancelación)
function confirmDialog({ title, message = '', confirmText = 'Confirmar', danger = false, input = null }) {
  const body = `<p style="margin:0 0 6px">${esc(message)}</p>
    ${input ? `<div class="field"><label for="cd-input">${esc(input.label)} ${input.required ? '<span class="req">*</span>' : ''}</label>
      <textarea id="cd-input" name="value" maxlength="${input.maxlength || 300}" ${input.required ? 'required' : ''} placeholder="${esc(input.placeholder || '')}"></textarea></div>` : ''}`;
  return openModal({
    title, body, submitText: confirmText, danger, size: 'sm', confirmDiscard: false,
    onSubmit: ({ form }) => {
      if (input) {
        if (!checkForm(form)) return false;
        return { value: form.elements.value.value.trim() };
      }
      return true;
    },
  }).then((r) => r || false);
}

// Color hexadecimal → rgba (para degradados); otros formatos se devuelven igual

// ---------- Gráfica ampliada ----------
// Al tocar o hacer clic en una gráfica se abre sola, en grande, sobre un fondo

let zoomAbierto = null;
function ampliarGrafica(canvas) {
  const orig = window.Chart?.getChart(canvas);
  const config = orig && chartConfigs.get(orig);
  if (!config || zoomAbierto) return;
  const card = canvas.closest('.card');
  const titulo = card?.querySelector('.card-head h3')?.textContent.trim() || canvas.getAttribute('aria-label') || 'Gráfica';
  const sub = card?.querySelector('.card-head p')?.textContent.trim() || '';
  const total = card?.querySelector('.card-head .total-badge')?.textContent.trim() || '';
  const ov = document.createElement('div');
  ov.className = 'chart-zoom';
  ov.setAttribute('role', 'dialog');
  ov.setAttribute('aria-modal', 'true');
  ov.setAttribute('aria-label', titulo);
  ov.innerHTML = `
    <div class="cz-card">
      <div class="cz-head">
        <div class="cz-tit"><h2>${esc(titulo)}</h2>${sub ? `<p>${esc(sub)}</p>` : ''}${total ? `<span class="total-badge">${esc(total)}</span>` : ''}</div>
        <div class="cz-acts">
          <button type="button" class="btn secondary" data-cz="png">${icon('image-down')} <span>Guardar imagen</span></button>
          <button type="button" class="icon-btn" data-cz="cerrar" aria-label="Cerrar" title="Cerrar (Esc)">${icon('x')}</button>
        </div>
      </div>
      <div class="cz-body"><canvas data-zoom="1" role="img" aria-label="${esc(titulo)}"></canvas></div>
      <div class="cz-pie"><span>Liberación de producto · Pet's Table</span><span class="cz-girar">${icon('smartphone')} Gira el teléfono para verla más grande</span></div>
    </div>`;
  document.body.appendChild(ov);
  document.body.classList.add('modal-open');
  refreshIcons();
  const cfg = { ...config, data: JSON.parse(JSON.stringify(config.data)) };
  cfg.data.datasets?.forEach((d) => { if (d.maxBarThickness) d.maxBarThickness = Math.round(d.maxBarThickness * 1.8); });
  const zc = makeChart(ov.querySelector('canvas'), cfg);
  charts.delete(zc);
  // Letras más grandes en la vista ampliada
  try {
    for (const s of Object.values(zc.options.scales || {})) if (s.ticks) s.ticks.font = { size: 14, weight: '600' };
    if (zc.options.plugins?.legend?.labels) zc.options.plugins.legend.labels.font = { size: 14 };
    zc.update('none');
  } catch { /* opciones no disponibles */ }
  const cerrar = () => {
    document.removeEventListener('keydown', onKey);
    try { zc.destroy(); } catch { /* ya destruida */ }
    ov.remove();
    if (!document.querySelector('.modal')) document.body.classList.remove('modal-open');
    zoomAbierto = null;
    canvas.focus?.();
  };
  const onKey = (e) => { if (e.key === 'Escape') cerrar(); };
  document.addEventListener('keydown', onKey);
  ov.addEventListener('click', (e) => {
    if (e.target === ov || e.target.closest('[data-cz="cerrar"]')) cerrar();
    else if (e.target.closest('[data-cz="png"]')) guardarGrafica(zc, titulo, [sub, total].filter(Boolean).join(' · '));
  });

}

// Imagen PNG con título, subtítulo y la gráfica sobre fondo sólido
async function guardarGrafica(chart, titulo, sub) {
  const src = chart.canvas, esc2 = 2;
  const w = src.width, h = src.height, pad = 24 * esc2, top = (sub ? 78 : 56) * esc2;
  const c = document.createElement('canvas');
  c.width = w + pad * 2; c.height = h + top + pad;
  const ctx = c.getContext('2d');
  ctx.fillStyle = cssVar('--card') || '#FFFFFF';
  ctx.fillRect(0, 0, c.width, c.height);
  ctx.fillStyle = cssVar('--text') || '#172431';
  ctx.font = `800 ${22 * esc2}px Inter, Segoe UI, system-ui, sans-serif`;
  ctx.textBaseline = 'top';
  ctx.fillText(titulo, pad, pad);
  if (sub) {
    ctx.fillStyle = cssVar('--muted') || '#687B8C';
    ctx.font = `500 ${14 * esc2}px Inter, Segoe UI, system-ui, sans-serif`;
    ctx.fillText(sub, pad, pad + 32 * esc2);
  }
  ctx.drawImage(src, pad, top);
  const nombre = `${titulo.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/gi, '-').replace(/^-|-$/g, '').toLowerCase() || 'grafica'}.png`;
  const blob = await new Promise((r) => c.toBlob(r, 'image/png'));
  if (!blob) { toast('No se pudo generar la imagen.', 'error'); return; }
  const file = new File([blob], nombre, { type: 'image/png' });
  // En celulares: compartir / guardar en fotos; en computadora: descarga directa
  if (matchMedia('(pointer: coarse)').matches && navigator.canShare?.({ files: [file] })) {
    try { await navigator.share({ files: [file], title: titulo }); return; } catch (err) { if (err?.name === 'AbortError') return; }
  }
  const url = URL.createObjectURL(blob);
  const a = Object.assign(document.createElement('a'), { href: url, download: nombre });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast('Imagen de la gráfica guardada.', 'success');
}

// En pantallas táctiles, tocar fuera de una gráfica oculta su recuadro de información

// ---------- Exportación de archivos ----------
// Lee todas las filas de una consulta en páginas de 1,000 (límite del servidor)
async function fetchAll(build, max = 50000) {
  const out = [];
  for (let from = 0; from < max; from += 1000) {
    const { data, error } = await build().range(from, from + 999);
    if (error) throw error;
    out.push(...data);
    if (data.length < 1000) break;
  }
  return out;
}
// CSV compatible con Excel (UTF-8 con BOM, separado por comas)
function toCSV(rows, cols) {
  const cell = (v) => {
    if (v === null || v === undefined) return '';
    if (typeof v === 'number') return String(v);
    // Evita que Excel interprete texto como fórmula
    const s = /^[=+\-@\t\r]/.test(String(v)) ? `'${v}` : String(v);
    return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  };
  return '﻿' + [cols.map((c) => cell(c.label)).join(','), ...rows.map((r) => cols.map((c) => cell(c.get(r))).join(','))].join('\r\n');
}
function descargar(nombre, contenido, tipo = 'text/csv;charset=utf-8') {
  const url = URL.createObjectURL(new Blob([contenido], { type: tipo }));
  const a = Object.assign(document.createElement('a'), { href: url, download: nombre });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

  if (act === 'liberar') { if (await liberar(l)) cargar(); return; }
  if (act === 'certificado') {
    a.disabled = true;
    try { await certificado(l); } catch (err) { console.error(err); toast(errMsg(err), 'error'); }
    a.disabled = false; return;
  }
  if (act === 'firmas') { if (await elegirFirmas(l, true)) cargar(); return; }
  if (act === 'revertir') {
    const r = await confirmDialog({
      title: `¿Revertir la liberación del lote ${l.lote}?`, danger: true, confirmText: 'Revertir liberación',
      message: `El certificado ${l.folio_certificado} deja de ser válido y el lote vuelve a quedar abierto para corregir sus análisis. Queda registrado en la bitácora.`,
      input: { label: 'Motivo de la reversión', required: true, maxlength: 300, placeholder: 'Por ejemplo: corrección del resultado de humedad' },
    });
    if (!r) return;
    const { error } = await sb.rpc('brom_revertir_liberacion', { p_muestra_id: l.id, p_motivo: r.value });
    if (error) { toast(errMsg(error), 'error'); return; }
    toast(`Se revirtió la liberación del lote ${l.lote}.`, 'success');
    cargar(); return;
  }
  if (act === 'borrar') {
    const ok = await confirmDialog({
      title: `¿Borrar el lote ${l.lote}?`, danger: true, confirmText: 'Borrar lote',
      message: `Se eliminará el lote y sus ${l.res.length} resultados${l.liberado_en ? `, incluido el registro de su liberación (folio ${l.folio_certificado})` : ''}. Esta acción no se puede deshacer.`,
    });
    if (!ok) return;
    const { error } = await sb.from('brom_muestras').delete().eq('id', l.id);
    if (error) { toast(errMsg(error), 'error'); return; }
    toast(`Lote ${l.lote} eliminado.`, 'success');
    cargar();
  }
}

async function certificado(l) {
  if (!l.firma_jefe_id) {
    if (!puedeElegirFirmas()) { toast('Este certificado aún no tiene firmas. Debe elegirlas el Jefe de calidad o un administrador.', 'warning', 6500); return; }
